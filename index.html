<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HerculePanel Radio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="https://herculepanel.github.io/main.css">

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Lalezar,Tahoma;
  color:var(--text);
  background:
    radial-gradient(
      circle at 12% 0%,
      rgba(255,180,58,.23),
      transparent 32%
    ),
    radial-gradient(
      circle at 88% 30%,
      rgba(62,227,154,.11),
      transparent 30%
    ),
    linear-gradient(180deg,#120e0b,#070605);
}

button,
a,
input{
  transition:
    transform .5s cubic-bezier(.22,1,.36,1),
    opacity .5s ease,
    border-color .5s ease,
    box-shadow .5s ease,
    background .5s ease;
}

button:not(:disabled):hover,
a.btn:hover{
  transform:translateY(-3px);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* =========================
   Layout
========================= */

.wrap{
  width:min(1160px,calc(100% - 30px));
  margin:auto;
  padding:35px 0 70px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.top-left{
  min-width:0;
}

.brand{
  direction:ltr;
  unicode-bidi:isolate;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:0;
  font-size:32px;
  line-height:1.2;
  white-space:nowrap;
}

.gold{
  color:var(--gold);
}

.badge{
  display:inline-block;
  margin-top:6px;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(62,227,154,.15);
  color:var(--mint);
  line-height:1.2;
}

.actions,
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

/* =========================
   Buttons
========================= */

.btn{
  border:0;
  cursor:pointer;
  border-radius:15px;
  padding:9px 13px;
  font:15px Lalezar;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  box-shadow:0 5px 0 rgba(0,0,0,.3);
  margin:4px;
}

.btn i{
  font-size:15px;
}

.mint{
  background:linear-gradient(180deg,#6af3b8,#17c77a);
  color:#042016;
}

.goldbtn{
  background:linear-gradient(180deg,#ffd27a,#ff9d1f);
  color:var(--ink);
}

.rose{
  background:linear-gradient(180deg,#ff8a97,#e23b4d);
  color:#fff;
}

.home{
  background:linear-gradient(180deg,#8ab0ff,#4d7dff);
  color:#061018;
  text-decoration:none;
}

.ghost{
  background:rgba(255,255,255,.06);
  color:var(--text);
  border:1px solid var(--line);
  box-shadow:none;
}

/* =========================
   Panels
========================= */

.panel,
.server{
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.085),
      rgba(255,180,58,.045),
      rgba(255,255,255,.025)
    );
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  padding:15px;
  margin-top:13px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 18px 45px rgba(0,0,0,.18);
}

/* =========================
   Inputs
========================= */

input{
  width:100%;
  padding:10px;
  border-radius:13px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--text);
  font:14px Lalezar;
  outline:none;
}

input:focus{
  border-color:rgba(255,180,58,.55);
  box-shadow:0 0 0 3px rgba(255,180,58,.08);
}

input[type=file]{
  padding:8px;
  cursor:pointer;
}

input[type=file]::file-selector-button{
  border:1px solid rgba(255,186,92,.35);
  border-radius:10px;
  padding:7px 11px;
  margin-inline-end:9px;
  background:linear-gradient(180deg,#ffd27a,#ff9d1f);
  color:#140f0a;
  font:14px Lalezar;
  cursor:pointer;
  transition:all .5s cubic-bezier(.22,1,.36,1);
}

input[type=file]::file-selector-button:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 20px rgba(255,180,58,.22);
}

label{
  display:block;
  color:var(--gold);
  margin:8px 0 5px;
}

/* =========================
   Songs
========================= */

.song{
  padding:14px;
  margin:10px 0;
  border-radius:16px;

  /*
    DIMMED SONG LIST
    Much darker than the original
    so songs don't appear bright
    when the list first loads.
  */
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.018),
      rgba(255,180,58,.012),
      rgba(255,255,255,.008)
    );

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  border:1px solid rgba(255,186,92,.12);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.018),
    0 8px 22px rgba(0,0,0,.12);
}

.song:hover{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.027),
      rgba(255,180,58,.018),
      rgba(255,255,255,.012)
    );

  border-color:rgba(255,186,92,.17);
}

.song:first-child{
  margin-top:4px;
}

.song-title{
  font-size:20px;
  margin-bottom:4px;
}

.song-info{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin:7px 0;
}

.format{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:999px;
  font-size:12px;
  background:rgba(255,180,58,.13);
  color:var(--gold);
}

.format.mp3{
  background:rgba(62,227,154,.13);
  color:var(--mint);
}

.url{
  direction:ltr;
  text-align:left;
  word-break:break-all;
  color:var(--muted);
  font-family:monospace;
  font-size:12px;
  margin:8px 0;
}

/* =========================
   Player
========================= */

.player{
  width:100%;
  padding:10px;
  border-radius:15px;
  border:1px solid var(--line);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,180,58,.018)
    );
  margin:10px 0;
}

.player-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.play-btn{
  width:46px;
  height:46px;
  border-radius:14px;
  border:1px solid rgba(255,186,92,.28);
  background:linear-gradient(180deg,#ffd27a,#ff9d1f);
  color:#140f0a;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.25);
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.play-btn:hover{
  box-shadow:
    0 8px 22px rgba(255,180,58,.18),
    0 5px 0 rgba(0,0,0,.25);
}

.player-main{
  flex:1;
  min-width:0;
}

.player-name{
  font-size:15px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.player-time{
  color:var(--muted);
  font-size:12px;
  direction:ltr;
  text-align:left;
  margin-top:2px;
}

.seek{
  width:100%;
  height:8px;
  margin-top:8px;
  appearance:none;
  -webkit-appearance:none;
  border-radius:999px;
  background:#211a12;
  outline:none;
  padding:0;
  border:0;
}

.seek::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--gold);
  cursor:pointer;
  box-shadow:0 0 0 3px rgba(255,180,58,.15);
}

.seek::-moz-range-thumb{
  width:16px;
  height:16px;
  border-radius:50%;
  border:0;
  background:var(--gold);
  cursor:pointer;
}

.volume{
  width:90px;
  height:7px;
  appearance:none;
  -webkit-appearance:none;
  border-radius:999px;
  background:#211a12;
  padding:0;
  border:0;
}

.volume::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:13px;
  height:13px;
  border-radius:50%;
  background:var(--mint);
  cursor:pointer;
}

.volume::-moz-range-thumb{
  width:13px;
  height:13px;
  border-radius:50%;
  border:0;
  background:var(--mint);
  cursor:pointer;
}

.player-bottom{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:8px;
  flex-wrap:wrap;
}

/* =========================
   Standard Modals
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(8,6,4,.62);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  opacity:1;
  animation:modalIn .45s cubic-bezier(.22,1,.36,1);
}

.modal.closing{
  animation:modalOut .4s cubic-bezier(.55,0,.78,.18) forwards;
}

.modal.hidden{
  display:none;
}

.modalbox{
  width:min(560px,calc(100% - 30px));
  max-height:92vh;
  overflow:auto;
  padding:20px;
  border-radius:20px;
  border:1px solid var(--line);
  background:rgba(22,17,12,.78);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:
    0 28px 80px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);
  animation:boxIn .55s cubic-bezier(.22,1,.36,1);
}

.modal.closing .modalbox{
  animation:boxOut .35s cubic-bezier(.55,0,.78,.18) forwards;
}

@keyframes modalIn{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

@keyframes modalOut{
  from{
    opacity:1;
  }

  to{
    opacity:0;
  }
}

@keyframes boxIn{
  from{
    opacity:0;
    transform:
      translateY(18px)
      scale(.96);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes boxOut{
  to{
    opacity:0;
    transform:
      translateY(16px)
      scale(.96);
  }
}

.hidden{
  display:none!important;
}

/* =========================
   Loading / Progress
========================= */

.loading{
  text-align:center;
  color:var(--muted);
}

.bar{
  height:12px;
  border-radius:999px;
  background:#1b1711;
  overflow:hidden;
  margin-top:8px;
}

.fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--gold),var(--mint));
  transition:width .25s ease;
}

/* =========================
   Toast
========================= */

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,22px) scale(.96);
  padding:12px 18px;
  border-radius:14px;
  background:rgba(23,18,13,.78);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);
  box-shadow:
    0 18px 45px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.08);
  opacity:0;
  animation:toastIn .5s cubic-bezier(.22,1,.36,1) forwards;
  z-index:200;
  display:flex;
  align-items:center;
  gap:7px;
}

.toast.hide{
  animation:toastOut .45s cubic-bezier(.55,0,.78,.18) forwards;
}

.toast.ok{
  color:#9dffc9;
}

.toast.err{
  color:#ffb0b7;
}

.toast.info{
  color:#b9d0ff;
}

@keyframes toastIn{
  to{
    opacity:1;
    transform:
      translate(-50%,0)
      scale(1);
  }
}

@keyframes toastOut{
  to{
    opacity:0;
    transform:
      translate(-50%,18px)
      scale(.94);
  }
}

/* =========================
   Spinner
========================= */

.spin{
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid rgba(0,0,0,.25);
  border-top-color:#111;
  border-radius:50%;
  animation:s .7s linear infinite;
}

@keyframes s{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   Busy
========================= */

.busy{
  position:fixed;
  inset:auto 50% 18px auto;
  transform:translateX(50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(20,15,10,.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:50;
  box-shadow:0 8px 30px #0008;
}

.busy.hidden{
  display:none;
}

/* =========================================================
   DASHBOARD CUSTOM ALERT / CONFIRM
   Copied in structure/style from the supplied Dashboard.
========================================================= */

.dialogIcon{
  width:54px;
  height:54px;

  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:0 auto 12px;

  font-size:25px;

  background:
    rgba(255,180,58,.12);

  color:var(--gold);

  border:1px solid
    rgba(255,180,58,.22);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.08);
}

.dialogTitle{
  text-align:center;

  font-size:23px;

  margin:0 0 5px;
}

.dialogText{
  text-align:center;

  color:var(--muted);

  font-size:15px;

  line-height:1.8;

  margin:0 0 18px;

  white-space:pre-wrap;
}

.dialogButtons{
  display:flex;
  gap:8px;
}

.dialogButtons .btn{
  flex:1;
}

.dialogDanger .dialogIcon{
  color:var(--rose);

  background:
    rgba(255,113,128,.10);

  border-color:
    rgba(255,113,128,.25);
}

.dialogSuccess .dialogIcon{
  color:var(--mint);

  background:
    rgba(62,227,154,.10);

  border-color:
    rgba(62,227,154,.25);
}

/* =========================
   Footer
========================= */

.footer{
  width:min(1160px,calc(100% - 30px));
  margin:18px auto 0;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:16px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,180,58,.035),
      rgba(255,255,255,.018)
    );
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 14px 35px rgba(0,0,0,.16);
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}

.footer-brand{
  color:var(--text);
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
}

.footer-link{
  color:var(--gold);
  text-decoration:none;
  transition:opacity .25s;
}

.footer-link:hover{
  opacity:.75;
}

.footer-dot{
  width:4px;
  height:4px;
  display:inline-block;
  border-radius:50%;
  background:var(--gold);
  opacity:.7;
}

/* =========================
   Mobile
========================= */

@media(max-width:850px){
  .grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:650px){
  .wrap{
    padding:18px 11px 50px;
  }

  .header,
  .head{
    align-items:center;
  }

  .brand{
    font-size:27px;
  }

  .btn{
    padding:9px 11px;
  }

  .modalbox{
    padding:15px;
    max-height:94vh;
  }

  .actions{
    width:100%;
  }
}

@media(max-width:500px){
  .footer{
    width:calc(100% - 20px);
    margin-top:12px;
    padding:11px 12px;
    font-size:11px;
  }

  .footer-brand{
    font-size:14px;
  }

  .song-title{
    font-size:18px;
  }

  .player-bottom{
    gap:7px;
  }

  .volume{
    width:75px;
  }

  .dialogButtons{
    flex-direction:column;
  }

  .dialogButtons .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<script>

const C={
  owner:"HerculePanel",
  repo:"HPanelRadio",
  branch:"main",
  gist:"eb1b8cd10486738c06ed9cc12677b7e2",
  file:"songs.json",

  workflow:"convert.yml"

========================================================= */

function getAuth(){

  try{

    return JSON.parse(
      localStorage.getItem(AUTH)||"null"
    );

  }catch{

    return null;

  }

}


function recoverRadioToken(){

  let t=
    localStorage.getItem(TK)||"";

  if(t)
    return t;

  try{

    const items=
      JSON.parse(
        localStorage.getItem(ITEMS_KEY)||"[]"
      );

    const x=
      items.find(x=>
        x &&
        x.token &&
        String(x.name||"")
          .toLowerCase()
          .includes("radio")
      );

    if(x?.token){

      localStorage.setItem(
        TK,
        x.token
      );

      return x.token;

    }

  }catch{}

  return "";

}

/* =========================================================
   GITHUB API
========================================================= */

function api(
  path,
  opt={}
){

  return fetch(
    "https://api.github.com"+path,
    {
      ...opt,

      headers:{

        "Accept":
          "application/vnd.github+json",

        "X-GitHub-Api-Version":
          "2022-11-28",

        "Authorization":
          "Bearer "+token,

        ...(opt.headers||{})

      }
    }
  );

}


async function json(
  path,
  opt={}
){

  const r=
    await api(
      path,
      opt
    );

  const d=
    await r
      .json()
      .catch(
        ()=>null
      );

  if(!r.ok)
    throw Error(
      d?.message ||
      "GitHub API "+r.status
    );

  return d;

}


/* =========================================================
   HELPERS
========================================================= */

function esc(s){

  return String(s??"")
    .replaceAll(
      "&","&amp;"
    )
    .replaceAll(
      "<","&lt;"
    )
    .replaceAll(
      ">","&gt;"
    )
    .replaceAll(
      '"',"&quot;"
    )
    .replaceAll(
      "'","&#039;"
    );

}


function publicUrl(n){

  return `https://${C.owner}.github.io/${C.repo}/${C.folder}/${encodeURIComponent(n)}`;

}


function isMp3File(file){

  if(!file)
    return false;

  const name=
    String(file.name||"")
      .trim()
      .toLowerCase();

  /*
    Filename extension is authoritative.
    Do NOT rely on file.type because browsers,
    especially Android browsers, can report MP3
    MIME types inconsistently.
  */

  return /\.mp3$/i.test(name);

}


function isMp3Url(url){

  try{

    const u=
      new URL(
        url
      );

    const pathname=
      u.pathname
        .split("?")[0]
        .split("#")[0]
        .toLowerCase();

    return pathname.endsWith(
      ".mp3"
    );

  }catch{

    return /\.mp3(?:[?#]|$)/i.test(
      String(url||"").trim()
    );

  }

}


function getExtension(name){

  const n=
    String(name||"");

  const p=
    n.lastIndexOf(".");

  if(p<0)
    return "";

  return n.slice(
    p+1
  ).toLowerCase();

}


function safeFileName(name){

  return String(name||"file")
    .replace(
      /[\\/:*?"<>|]/g,
      "_"
    )
    .replace(
      /\s+/g,
      "_"
    );

}

/* =========================================================
   CUSTOM PLAYER
========================================================= */

function getAudio(i){

  return document.getElementById(
    "audio-"+i
  );

}


function togglePlay(i){

  const audio=
    getAudio(i);

  if(!audio)
    return;


  if(audio.paused){

    document
      .querySelectorAll("audio")
      .forEach(x=>{

        if(x!==audio)
          x.pause();

      });


    audio
      .play()
      .catch(()=>{

        toast(
          "پخش آهنگ ممکن نیست",
          "err"
        );

      });

  }else{

    audio.pause();

  }


  updatePlayButton(i);

}


function updatePlayButton(i){

  const audio=
    getAudio(i);

  const btn=
    document.getElementById(
      "play-"+i
    );

  if(!audio||!btn)
    return;


  btn.innerHTML=
    audio.paused
      ?
      '<i class="bi bi-play-fill"></i>'
      :
      '<i class="bi bi-pause-fill"></i>';

}


function audioLoaded(i){

  const audio=
    getAudio(i);

  if(!audio)
    return;


  const d=
    document.getElementById(
      "duration-"+i
    );


  d.textContent=
    formatTime(
      audio.duration
    );

}


function audioTime(i){

  const audio=
    getAudio(i);

  if(!audio)
    return;


  const seek=
    document.getElementById(
      "seek-"+i
    );

  const current=
    document.getElementById(
      "current-"+i
    );


  if(audio.duration){

    seek.value=
      (
        audio.currentTime/
        audio.duration
      )*100;

  }


  current.textContent=
    formatTime(
      audio.currentTime
    );


  updatePlayButton(i);

}


function audioEnded(i){

  const seek=
    document.getElementById(
      "seek-"+i
    );


  if(seek)
    seek.value=0;


  updatePlayButton(i);

}


function audioError(i){

  console.warn(
    "Audio failed:",
    songs[i]?.url
  );

}


function seekAudio(
  i,
  value
){

  const audio=
    getAudio(i);

  if(
    !audio||
    !audio.duration
  )
    return;


  audio.currentTime=
    (
      Number(value)/100
    )*
    audio.duration;

}


function setVolume(
  i,
  value
){

  const audio=
    getAudio(i);

  if(audio)
    audio.volume=
      Number(value);

}


function formatTime(sec){

  if(!Number.isFinite(sec))
    return "00:00";


  sec=Math.max(
    0,
    Math.floor(sec)
  );


  const m=
    Math.floor(sec/60)
      .toString()
      .padStart(2,"0");


  const s=
    (sec%60)
      .toString()
      .padStart(2,"0");


  return `${m}:${s}`;

}

/* =========================================================
   BASE64
========================================================= */

function b64(file){

  return new Promise(
    (res,rej)=>{

      const r=
        new FileReader();


      r.onload=()=>{

        res(
          String(
            r.result
          ).split(",")[1]
        );

      };


      r.onerror=rej;


      r.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   UPLOAD TO REPO
========================================================= */

async function uploadFileToRepo(file){

  const safeName=
    safeFileName(
      file.name
    );


  const path=
    C.folder+
    "/"+
    safeName;


  const content=
    await b64(file);


  document.getElementById(
    "fill"
  ).style.width="30%";


  const result=
    await json(
      "/repos/"+
      C.owner+
      "/"+
      C.repo+
      "/contents/"+
      encodeURIComponent(path)
        .replace(
          /%2F/g,
          "/"
        ),
      {
        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          message:
            "Add audio "+
            safeName,

          content,

          branch:
            C.branch

        })

      }
    );


  document.getElementById(
    "fill"
  ).style.width="100%";


  return{

    path,

    name:
      safeName,

    url:
      publicUrl(
        safeName
      ),

    sha:
      result.content?.sha||
      ""

  };

}

========================================================= */

async function saveSong(){

  const title=
    document.getElementById(
      "title"
    )
    .value
    .trim();


  const file=
    document.getElementById(
      "file"
    )
    .files[0];


  let url=
    document.getElementById(
      "url"
    )
    .value
    .trim();


  if(!title){

    toast(
      "عنوان را بنویس",
      "err"
    );

    return;

  }


  if(!file&&!url){

    toast(
      "فایل یا لینک را وارد کن",
      "err"
    );

    return;

  }


  /*
    Uploaded file:
    determine MP3 by filename.
  */

  if(file){

    if(
      file.size>
      20*1024*1024
    ){

      toast(
        "حجم فایل باید کمتر از ۲۰ مگابایت باشد",
        "err"
      );

      return;

    }


    const mp3=
      isMp3File(file);


    /*
      Non-MP3 confirmation happens BEFORE upload.
    */

    if(!mp3){

      const yes=
        await customConfirm(

          "این فایل یک فایل MP3 نیست.\n\n"+
          "این فایل نمی‌تواند مستقیماً در بازی نوشته شود.\n\n"+
          "تبدیل فایل به MP3 بعد از آپلود از داخل همین وب‌سایت امکان‌پذیر است.\n\n"+
          "آیا می‌خواهید با آپلود فایل ادامه دهید؟",

          "فایل MP3 نیست"

        );


      if(!yes)
        return;

    }


    busy(
      true,
      mp3
        ?
        "در حال آپلود فایل MP3 به مخزن..."
        :
        "در حال آپلود فایل به مخزن..."
    );


    try{

      const uploaded=
        await uploadFileToRepo(
          file
        );


      songs.push({

        title,

        url:
          uploaded.url,

        size:
          file.size,

        added:
          new Date()
            .toISOString(),

        format:
          mp3
            ?"mp3"
            :"source",

        sourceFile:
          uploaded.path,

        converting:false

      });


      busy(
        true,
        "فایل در مخزن قرار گرفت؛ در حال ذخیره اطلاعات..."
      );


      await saveGist();


      render();

      closeAdd();

      resetAdd();


      toast(
        mp3
          ?
          "فایل MP3 با موفقیت آپلود شد"
          :
          "فایل آپلود شد؛ حالا می‌توانید آن را به MP3 تبدیل کنید",
        "ok"
      );


    }catch(e){

      toast(
        e.message,
        "err"
      );


    }finally{

      busy(false);

    }


    return;

  }


  /*
    URL mode.
  */

  if(
    !/^https?:\/\//i.test(url)
  ){

    toast(
      "لینک نامعتبر است",
      "err"
    );

    return;

  }


  const mp3=
    isMp3Url(url);


  if(!mp3){

    const yes=
      await customConfirm(

        "این لینک به یک فایل MP3 ختم نمی‌شود.\n\n"+
        "این فایل احتمالاً نمی‌تواند مستقیماً در بازی استفاده شود.\n\n"+
        "تبدیل فایل به MP3 بعد از اضافه شدن امکان‌پذیر است.\n\n"+
        "آیا می‌خواهید ادامه دهید؟",

        "لینک MP3 نیست"

      );


    if(!yes)
      return;

  }


  busy(
    true,
    "در حال ذخیره لینک..."
  );


  try{

    songs.push({

      title,

      url,

      size:0,

      added:
        new Date()
          .toISOString(),

      format:
        mp3
          ?"mp3"
          :"source",

      converting:false

    });


    await saveGist();


    render();

    closeAdd();

    resetAdd();


    toast(
      mp3
        ?
        "لینک MP3 ذخیره شد"
        :
        "لینک ذخیره شد",
      "ok"
    );


  }catch(e){

    toast(
      e.message,
      "err"
    );


  }finally{

    busy(false);

  }

}

========================================================= */

async function convertSong(i){

  const s=
    songs[i];


  if(!s)
    return;


  if(
    isMp3Url(s.url) ||
    String(
      s.format||""
    ).toLowerCase()==="mp3"
  ){

    toast(
      "این آهنگ از قبل MP3 است",
      "ok"
    );

    return;

  }


  if(s.converting){

    toast(
      "این آهنگ در حال تبدیل است",
      "err"
    );

    return;

  }


  if(!s.sourceFile){

    await customAlert(

      "برای این آهنگ مسیر فایل اصلی در مخزن ثبت نشده است.\n\n"+
      "اگر فایل واقعاً داخل مخزن است، ابتدا آن را با دکمه ویرایش بررسی کنید.",

      "امکان تبدیل نیست",

      "error"

    );

    return;

  }


  const source=
    s.sourceFile;


  const base=
    source
      .split("/")
      .pop()
      .replace(
        /\.[^/.]+$/,
        ""
      );


  const output=
    C.folder+
    "/"+
    safeFileName(base)+
    "_converted.mp3";


  const yes=
    await customConfirm(

      "فایل اصلی در مخزن قرار دارد.\n\n"+
      "GitHub Actions آن را با FFmpeg به MP3 تبدیل می‌کند.\n\n"+
      "پس از اتمام، لینک آهنگ در Gist به فایل MP3 تغییر خواهد کرد.\n\n"+
      "ادامه می‌دهید؟",

      "تبدیل به MP3"

    );


  if(!yes)
    return;


  s.converting=true;

  render();


  await saveGist();


  busy(
    true,
    "در حال شروع تبدیل در GitHub..."
  );


  try{

    await json(
      "/repos/"+
      C.owner+
      "/"+
      C.repo+
      "/actions/workflows/"+
      C.workflow+
      "/dispatches",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          ref:
            C.branch,

          inputs:{
            source,
            output
          }

        })

      }
    );


    busy(
      true,
      "تبدیل شروع شد؛ منتظر MP3 هستیم..."
    );


    const exists=
      await waitForFile(
        output,
        8*60*1000
      );


    if(!exists){

      throw Error(
        "تبدیل انجام نشد یا فایل خروجی در زمان تعیین‌شده پیدا نشد"
      );

    }


    s.url=
      publicUrl(
        output
          .split("/")
          .pop()
      );


    s.format="mp3";

    s.converting=false;

    s.convertedAt=
      new Date()
        .toISOString();

    s.convertedFile=
      output;


    await saveGist();


    render();


    toast(
      "تبدیل به MP3 با موفقیت انجام شد",
      "ok"
    );


  }catch(e){

    s.converting=false;


    try{

      await saveGist();

    }catch{}


    render();


    toast(
      e.message||
      "خطا در تبدیل",
      "err"
    );


  }finally{

    busy(false);

  }

}


/* =========================================================
   CHECK FILE
========================================================= */

async function fileExists(path){

  try{

    await json(
      "/repos/"+
      C.owner+
      "/"+
      C.repo+
      "/contents/"+
      encodeURIComponent(path)
        .replace(
          /%2F/g,
          "/"
        )+
      "?ref="+
      encodeURIComponent(
        C.branch
      )
    );


    return true;

  }catch{

    return false;

  }

}


async function waitForFile(
  path,
  timeout
){

  const started=
    Date.now();


  while(
    Date.now()-started<
    timeout
  ){

    if(
      await fileExists(path)
    )
      return true;


    await new Promise(
      resolve=>
        setTimeout(
          resolve,
          5000
        )
    );

  }


  return false;

}


/* =========================================================
   EDIT GIST DATA
========================================================= */

function openEdit(i){

  const s=
    songs[i];


  if(!s)
    return;


  document.getElementById(
    "editIndex"
  ).value=i;


  document.getElementById(
    "editTitle"
  ).value=
    s.title||"";


  document.getElementById(
    "editUrl"
  ).value=
    s.url||"";


  document
    .getElementById(
      "editModal"
    )
    .classList
    .remove(
      "hidden",
      "closing"
    );

}


function closeEdit(){

  const m=
    document.getElementById(
      "editModal"
    );


  if(
    m.classList.contains(
      "hidden"
    )
  )
    return;


  m.classList.add(
    "closing"
  );


  setTimeout(()=>{

    m.classList.add(
      "hidden"
    );

    m.classList.remove(
      "closing"
    );

  },400);

}


async function saveEdit(){

  const i=
    Number(
      document.getElementById(
        "editIndex"
      ).value
    );


  if(!songs[i])
    return;


  const title=
    document.getElementById(
      "editTitle"
    )
    .value
    .trim();


  const url=
    document.getElementById(
      "editUrl"
    )
    .value
    .trim();


  if(!title){

    toast(
      "عنوان را وارد کنید",
      "err"
    );

    return;

  }


  if(
    !/^https?:\/\//i.test(url)
  ){

    toast(
      "لینک نامعتبر است",
      "err"
    );

    return;

  }


  busy(
    true,
    "در حال ویرایش اطلاعات آهنگ..."
  );


  try{

    songs[i].title=
      title;

    songs[i].url=
      url;


    songs[i].format=
      isMp3Url(url)
        ?
        "mp3"
        :
        "source";


    await saveGist();


    render();

    closeEdit();


    toast(
      "اطلاعات آهنگ در Gist ویرایش شد",
      "ok"
    );


  }catch(e){

    toast(
      e.message,
      "err"
    );


  }finally{

    busy(false);

  }

}


/* =========================================================
   DELETE
========================================================= */

async function del(i){

  const yes=
    await customConfirm(

      "این آهنگ از فهرست Gist حذف شود؟\n\n"+
      "فایل موجود در مخزن حذف نخواهد شد.",

      "حذف آهنگ"

    );


  if(!yes)
    return;


  const old=
    songs[i];


  songs.splice(
    i,
    1
  );


  busy(
    true,
    "در حال حذف اطلاعات آهنگ..."
  );


  try{

    await saveGist();


    render();


    toast(
      "اطلاعات آهنگ حذف شد؛ فایل مخزن باقی ماند",
      "ok"
    );


  }catch(e){

    songs.splice(
      i,
      0,
      old
    );


    render();


    toast(
      e.message,
      "err"
    );


  }finally{

    busy(false);

  }

}


/* =========================================================
   COPY
========================================================= */

function copy(i){

  navigator.clipboard
    .writeText(
      songs[i].url
    )
    .then(
      ()=>toast(
        "لینک کپی شد",
        "ok"
      )
    )
    .catch(
      e=>toast(
        e.message,
        "err"
      )
    );

}
