<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">

<title>HPanel Radio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
:root{
  --bg:#0b0a09;
  --panel:rgba(25,20,15,.72);
  --panel2:rgba(38,29,20,.60);
  --text:#fff6ea;
  --muted:#c3b09a;
  --line:rgba(255,186,92,.20);
  --gold:#ffb43a;
  --gold2:#ffd27b;
  --mint:#3ee39a;
  --rose:#ff667d;
  --blue:#68a8ff;
  --ink:#140f0a;
  --shadow:0 24px 70px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,180,58,.12),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(62,227,154,.07),transparent 25%),
    radial-gradient(circle at 50% 100%,rgba(104,168,255,.06),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:"Lalezar",sans-serif;
}

body{
  padding:22px;
}

button,
input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:min(100%,900px);
  margin:auto;
}

.card{
  border:1px solid var(--line);
  border-radius:28px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),
    var(--panel);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.header{
  padding:22px;
  display:flex;
  gap:14px;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.brand{
  font-size:30px;
  line-height:1;
  letter-spacing:.3px;
}

.brand .h,
.brand .p,
.footerBrand .h,
.footerBrand .p{
  color:var(--gold);
}

.brand .rest{
  color:var(--text);
}

.headerActions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.btn{
  min-height:42px;
  padding:9px 14px;
  border-radius:14px;
  color:var(--text);
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  transition:.18s ease;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}

.btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.08);
}

.btn:active{
  transform:translateY(0) scale(.98);
}

.btn i{
  margin-left:5px;
}

.btn.gold{
  color:var(--ink);
  background:linear-gradient(145deg,var(--gold2),var(--gold));
  border-color:transparent;
}

.btn.mint{
  color:#07150e;
  background:linear-gradient(145deg,#73f1b5,var(--mint));
  border-color:transparent;
}

.btn.rose{
  color:#21070c;
  background:linear-gradient(145deg,#ff8a9a,var(--rose));
  border-color:transparent;
}

.btn.blue{
  color:#071120;
  background:linear-gradient(145deg,#9bc4ff,var(--blue));
  border-color:transparent;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

.content{
  padding:20px;
}

.section{
  margin-bottom:18px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(255,255,255,.025);
}

.section:last-child{
  margin-bottom:0;
}

.sectionTitle{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:20px;
  margin-bottom:13px;
}

.sectionTitle i{
  color:var(--gold);
}

.hint{
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:13px;
  line-height:1.8;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  color:var(--muted);
  font-size:14px;
}

input[type="text"],
input[type="url"],
input[type="number"],
input[type="datetime-local"]{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 13px;
  outline:none;
  background:rgba(0,0,0,.20);
  color:var(--text);
  font-family:Arial,sans-serif;
}

input:focus{
  border-color:rgba(255,180,58,.55);
  box-shadow:0 0 0 3px rgba(255,180,58,.07);
}

.fileBox{
  position:relative;
  min-height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px dashed rgba(255,180,58,.38);
  border-radius:18px;
  padding:16px;
  background:rgba(255,180,58,.035);
  transition:.18s;
}

.fileBox:hover{
  background:rgba(255,180,58,.07);
}

.fileBox input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
}

.fileText i{
  font-size:28px;
  color:var(--gold);
}

.fileText div{
  margin-top:4px;
}

.fileName{
  color:var(--gold2);
  font-family:Arial,sans-serif;
  font-size:12px;
  word-break:break-all;
  margin-top:4px;
}

.uploadRow{
  margin-top:13px;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.progressWrap{
  display:none;
  margin-top:13px;
}

.progress{
  height:9px;
  border-radius:99px;
  overflow:hidden;
  background:rgba(255,255,255,.06);
}

.progressBar{
  width:0%;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  transition:width .25s;
}

.progressText{
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:12px;
  margin-top:6px;
}

.search{
  margin-bottom:14px;
}

.search input{
  width:100%;
}

.songs{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.song{
  border:1px solid var(--line);
  border-radius:21px;
  padding:15px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  box-shadow:0 12px 30px rgba(0,0,0,.18);
}

.songTop{
  display:flex;
  gap:10px;
  align-items:flex-start;
  justify-content:space-between;
}

.songTitle{
  min-width:0;
  font-size:20px;
  word-break:break-word;
}

.songMeta{
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:11px;
  margin-top:4px;
  line-height:1.8;
}

.formatBadge{
  flex:none;
  padding:5px 9px;
  border-radius:10px;
  font-size:11px;
  color:var(--gold2);
  border:1px solid rgba(255,180,58,.22);
  background:rgba(255,180,58,.07);
}

.formatBadge.mp3{
  color:#07150e;
  background:var(--mint);
  border-color:transparent;
}

.formatBadge.converted{
  color:#071120;
  background:var(--blue);
  border-color:transparent;
}

.player{
  margin-top:13px;
  border:1px solid var(--line);
  border-radius:17px;
  padding:11px;
  background:rgba(0,0,0,.20);
}

.playerControls{
  display:flex;
  gap:8px;
  align-items:center;
}

.playBtn{
  width:42px;
  height:42px;
  flex:none;
  border-radius:13px;
  color:var(--ink);
  background:linear-gradient(145deg,var(--gold2),var(--gold));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.playerTime{
  width:83px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:11px;
  text-align:center;
  direction:ltr;
}

.seek{
  flex:1;
  appearance:none;
  height:6px;
  border-radius:99px;
  background:rgba(255,255,255,.10);
  outline:none;
  cursor:pointer;
}

.seek::-webkit-slider-thumb{
  appearance:none;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--gold);
  border:2px solid #fff0d2;
}

.seek::-moz-range-thumb{
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--gold);
  border:2px solid #fff0d2;
}

.volume{
  width:70px;
  appearance:none;
  height:5px;
  border-radius:99px;
  background:rgba(255,255,255,.10);
  outline:none;
}

.volume::-webkit-slider-thumb{
  appearance:none;
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--gold2);
}

.volume::-moz-range-thumb{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--gold2);
}

.playerBottom{
  margin-top:9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.playerStatus{
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:10px;
}

.songActions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.songActions .btn{
  min-height:38px;
  padding:7px 11px;
  font-size:13px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.empty i{
  display:block;
  font-size:42px;
  margin-bottom:8px;
  color:var(--gold);
}

.loading{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.spinner{
  display:inline-block;
  width:23px;
  height:23px;
  border:3px solid rgba(255,255,255,.12);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite;
  vertical-align:middle;
  margin-left:8px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.footer{
  margin-top:18px;
  padding:20px;
  text-align:center;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:12px;
  line-height:2;
}

.footerBrand{
  font-family:"Lalezar",sans-serif;
  font-size:22px;
  color:var(--text);
}

.footer .version{
  color:var(--gold);
}

.footer .heart{
  color:#ff667d;
}

.modalBack{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.70);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal{
  width:min(100%,520px);
  border:1px solid var(--line);
  border-radius:25px;
  padding:21px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025)),
    #17120e;
  box-shadow:0 30px 100px rgba(0,0,0,.65);
}

.modalIcon{
  width:52px;
  height:52px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  color:var(--ink);
  background:linear-gradient(145deg,var(--gold2),var(--gold));
  margin-bottom:12px;
}

.modalTitle{
  font-size:23px;
}

.modalText{
  margin-top:7px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:13px;
  line-height:1.9;
  white-space:pre-line;
}

.modalActions{
  display:flex;
  gap:9px;
  justify-content:flex-end;
  margin-top:18px;
  flex-wrap:wrap;
}

.toastBox{
  position:fixed;
  z-index:2000;
  left:18px;
  bottom:18px;
  width:min(390px,calc(100% - 36px));
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
}

.toast{
  pointer-events:auto;
  padding:12px 14px;
  border-radius:15px;
  border:1px solid var(--line);
  background:rgba(20,15,10,.92);
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  animation:toastIn .2s ease;
  font-family:Arial,sans-serif;
  font-size:13px;
}

.toast.ok{
  border-color:rgba(62,227,154,.35);
}

.toast.err{
  border-color:rgba(255,102,125,.35);
}

.toast.info{
  border-color:rgba(104,168,255,.35);
}

@keyframes toastIn{
  from{transform:translateY(10px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.errorPanel{
  text-align:center;
  padding:30px 15px;
}

.errorPanel i{
  color:var(--rose);
  font-size:45px;
}

.hidden{
  display:none!important;
}

@media(max-width:650px){
  body{
    padding:10px;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .headerActions{
    width:100%;
    justify-content:flex-start;
  }

  .formGrid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .playerControls{
    flex-wrap:wrap;
  }

  .seek{
    order:5;
    flex-basis:100%;
  }

  .volume{
    width:55px;
  }
}
</style>
</head>

<body>

    </div>

<!-- General modal -->

<div class="modalBack" id="modalBack">

  <div class="modal">

    <div class="modalIcon" id="modalIcon">
      <i class="bi bi-info-lg"></i>
    </div>

    <div class="modalTitle" id="modalTitle">
      پیام
    </div>

    <div class="modalText" id="modalText"></div>

    <div class="modalActions" id="modalActions"></div>

  </div>

<div class="toastBox" id="toastBox"></div>


<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const C = {
  owner: "HerculePanel",
  repo: "HPanelRadio",
  branch: "main",

  gist: "eb1b8cd10486738c06ed9cc12677b7e2",

  file: "songs.json",
  folder: "songs",

  workflow: "convert.yml",

  vaultUrl: "https://herculepanel.github.io/vault/",
  homeUrl: "https://herculepanel.github.io/"
};


/* =========================================================
   HPanel AUTH
========================================================= */

const AUTH_KEY = "hpanel_auth";
const ITEMS_KEY = "hpanel_vault_items";
const RADIO_TOKEN_KEY = "hpanel_radio_token";

let token = "";
let admin = false;
let songs = [];
let selectedFile = null;
let modalResolve = null;


/* =========================================================
   AUTH
========================================================= */

function getAuth(){
  try{
    return JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
  }catch{
    return null;
  }
}


function recoverRadioToken(){

  let t = localStorage.getItem(RADIO_TOKEN_KEY) || "";

  if(t){
    return t;
  }

  try{

    const items = JSON.parse(
      localStorage.getItem(ITEMS_KEY) || "[]"
    );

    const item = items.find(x =>
      x &&
      x.token &&
      String(x.name || "")
        .toLowerCase()
        .includes("radio")
    );

    if(item?.token){

      localStorage.setItem(
        RADIO_TOKEN_KEY,
        item.token
      );

      return item.token;
    }

  }catch{}

  return "";
}


/* =========================================================
   UI
========================================================= */

function $(id){
  return document.getElementById(id);
}


function toast(message,type="info"){

  const box = $("toastBox");

  const el = document.createElement("div");

  el.className = "toast " + type;
  el.textContent = message;

  box.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },3800);
}


function closeModal(value=null){

  $("modalBack").style.display = "none";

  if(modalResolve){

    const resolve = modalResolve;

    modalResolve = null;

    resolve(value);
  }
}


function openModal({
  title="پیام",
  text="",
  icon="bi-info-lg",
  buttons=[]
}){

  $("modalTitle").textContent = title;
  $("modalText").textContent = text;

  $("modalIcon").innerHTML =
    `<i class="bi ${icon}"></i>`;

  const actions = $("modalActions");

  actions.innerHTML = "";

  for(const b of buttons){

    const btn = document.createElement("button");

    btn.className = "btn " + (b.class || "");

    btn.innerHTML = b.html || b.text || "باشه";

    btn.onclick = ()=>{
      closeModal(b.value);
    };

    actions.appendChild(btn);
  }

  $("modalBack").style.display = "flex";
}


function askModal(options){

  return new Promise(resolve=>{

    modalResolve = resolve;

    openModal(options);

  });
}


function alertModal(title,text,type="info"){

  return askModal({

    title,
    text,

    icon:
      type === "error"
        ? "bi-exclamation-triangle"
        : type === "success"
          ? "bi-check-circle"
          : "bi-info-circle",

    buttons:[
      {
        text:"باشه",
        class:"gold",
        value:true
      }
    ]

  });
}


/* =========================================================
   GITHUB API
========================================================= */

function apiHeaders(){

  return {
    "Authorization":"Bearer " + token,
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  };

}


async function github(url,options={}){

  const response = await fetch(
    "https://api.github.com" + url,
    {
      ...options,

      headers:{
        ...apiHeaders(),
        ...(options.headers || {})
      }
    }
  );

  let data = null;

  try{
    data = await response.json();
  }catch{}

  if(!response.ok){

    const message =
      data?.message ||
      `GitHub error ${response.status}`;

    throw new Error(message);
  }

  return data;
}


/* =========================================================
   BASE64
========================================================= */

function arrayBufferToBase64(buffer){

  const bytes = new Uint8Array(buffer);

  let binary = "";

  const chunkSize = 0x8000;

  for(
    let i=0;
    i<bytes.length;
    i+=chunkSize
  ){

    binary += String.fromCharCode(
      ...bytes.subarray(
        i,
        Math.min(i+chunkSize,bytes.length)
      )
    );

  }

  return btoa(binary);
}


/* =========================================================
   PATH HELPERS
========================================================= */

function cleanFileName(name){

  return String(name || "audio")
    .replace(/[^\w.\-\u0600-\u06FF ]+/g,"_")
    .replace(/\s+/g,"_")
    .replace(/_+/g,"_")
    .slice(0,100);
}


function uniqueFileName(name){

  const dot = name.lastIndexOf(".");

  const base =
    dot > 0
      ? name.slice(0,dot)
      : name;

  const ext =
    dot > 0
      ? name.slice(dot)
      : "";

  return (
    cleanFileName(base) +
    "_" +
    Date.now() +
    ext.toLowerCase()
  );
}


function isMp3(file){

  if(!file)return false;

  const name = file.name.toLowerCase();

  return (
    name.endsWith(".mp3") ||
    file.type === "audio/mpeg"
  );
}


/* =========================================================
   SONG DATA
========================================================= */

function normalizeSongs(data){

  if(Array.isArray(data)){
    return data;
  }

  if(Array.isArray(data?.songs)){
    return data.songs;
  }

  return [];
}


async function loadSongs(){

  try{

    const raw = await github(
      `/gists/${C.gist}`
    );

    const content =
      raw?.files?.[C.file]?.content || "";

    if(!content.trim()){

      songs = [];

      return;
    }

    const data = JSON.parse(content);

    songs = normalizeSongs(data);

  }catch(error){

    console.error(error);

    throw new Error(
      "خواندن اطلاعات آهنگ‌ها ناموفق بود: " +
      error.message
    );
  }
}


/* =========================================================
   SAVE GIST
========================================================= */

async function saveSongs(){

  await github(
    `/gists/${C.gist}`,
    {
      method:"PATCH",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        files:{
          [C.file]:{
            content:JSON.stringify(
              {
                songs:songs
              },
              null,
              2
            )
          }
        }

      })
    }
  );

}


/* =========================================================
   REPO UPLOAD
========================================================= */

async function uploadToRepo(file,path){

  const buffer = await file.arrayBuffer();

  const base64 = arrayBufferToBase64(buffer);

  const data = await github(
    `/repos/${C.owner}/${C.repo}/contents/${encodeURIComponent(path)}`,
    {
      method:"PUT",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        message:
          "Upload audio: " +
          file.name,

        content:base64,

        branch:C.branch

      })
    }
  );

  return data;
}

/* =========================================================
   UPLOAD FLOW
========================================================= */

async function uploadSong(){

  const title =
    $("songTitle").value.trim();

  const file = selectedFile;

  if(!title){

    await alertModal(
      "عنوان وارد نشده",
      "لطفاً عنوان آهنگ را وارد کنید."
    );

    return;
  }

  if(!file){

    await alertModal(
      "فایلی انتخاب نشده",
      "لطفاً یک فایل صوتی انتخاب کنید."
    );

    return;
  }


  /*
    GitHub Contents API has practical limits.
    Keep this conservative for phone/browser uploads.
  */

  if(file.size > 30 * 1024 * 1024){

    await alertModal(
      "فایل خیلی بزرگ است",
      "حداکثر حجم فایل برای آپلود در این نسخه ۳۰ مگابایت است.",
      "error"
    );

    return;
  }


  const mp3 = isMp3(file);


  /*
    NON-MP3 CONFIRMATION
  */

  if(!mp3){

    const answer = await askModal({

      title:"این فایل MP3 نیست",

      text:
        "این فایل MP3 نیست.\n\n" +
        "این فایل نمی‌تواند مستقیماً در بازی نوشته و استفاده شود. " +
        "تبدیل فایل به MP3 در همین وب‌سایت امکان‌پذیر است.\n\n" +
        "آیا می‌خواهید فایل اصلی را در مخزن آپلود کنید؟",

      icon:"bi-exclamation-triangle",

      buttons:[

        {
          text:"خیر، لغو",
          class:"",
          value:false
        },

        {
          text:"بله، ادامه بده",
          class:"gold",
          value:true
        }

      ]

    });

    if(!answer){

      return;
    }

  }


  setUploadBusy(true);

  try{

    /*
      Generate repository filename.
    */

    const repoName =
      uniqueFileName(file.name);

    const repoPath =
      `${C.folder}/${repoName}`;


    setProgress(
      8,
      "در حال آماده‌سازی فایل..."
    );


    /*
      ACTUAL REPO UPLOAD
    */

    await uploadToRepo(
      file,
      repoPath
    );


    setProgress(
      100,
      "فایل با موفقیت در مخزن آپلود شد."
    );


    /*
      Wait a moment so GitHub Pages/contents
      can see the newly-created file.
    */

    await waitForRepoFile(
      repoPath,
      30000
    );


    const url =
      `https://${C.owner}.github.io/${C.repo}/${C.folder}/${encodeURIComponent(repoName)}`;


    /*
      MP3:
      immediately add to Gist.
    */

    if(mp3){

      songs.unshift({

        id:crypto.randomUUID
          ? crypto.randomUUID()
          : String(Date.now()),

        title,

        url,

        size:file.size,

        added:new Date().toISOString(),

        format:"mp3",

        repoPath

      });

      await saveSongs();

      toast(
        "آهنگ MP3 با موفقیت آپلود شد.",
        "ok"
      );

    }


    /*
      NON-MP3:
      It is already in the repo.
      Now add its metadata to Gist.
      It gets a conversion button.
    */

    else{

      songs.unshift({

        id:crypto.randomUUID
          ? crypto.randomUUID()
          : String(Date.now()),

        title,

        url,

        size:file.size,

        added:new Date().toISOString(),

        format:"source",

        repoPath,

        converted:false,

        convertedUrl:"",

        convertedPath:""

      });

      await saveSongs();

      toast(
        "فایل آپلود شد. حالا می‌توانید آن را به MP3 تبدیل کنید.",
        "ok"
      );

    }


    $("songTitle").value = "";

    $("songFile").value = "";

    selectedFile = null;

    $("selectedFileName").textContent =
      "هنوز فایلی انتخاب نشده";

    renderSongs();

  }catch(error){

    console.error(error);

    await alertModal(
      "خطا در آپلود",
      error.message,
      "error"
    );

  }finally{

    setUploadBusy(false);

  }

}


/* =========================================================
   VERIFY REPO FILE
========================================================= */

async function waitForRepoFile(
  path,
  timeout=30000
){

  const started = Date.now();

  while(Date.now() - started < timeout){

    try{

      await github(
        `/repos/${C.owner}/${C.repo}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(C.branch)}`
      );

      return true;

    }catch{}

    await sleep(1500);
  }

  /*
    The PUT itself already confirms the upload.
    This is only a second verification.
  */

  return true;
}


function sleep(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );

}


/* =========================================================
   CONVERSION
========================================================= */

async function convertSong(index){

  const song = songs[index];

  if(!song){
    return;
  }

  if(song.format === "mp3"){

    toast(
      "این آهنگ از قبل MP3 است.",
      "info"
    );

    return;
  }

  if(song.converted && song.convertedUrl){

    toast(
      "این آهنگ قبلاً تبدیل شده است.",
      "info"
    );

    return;
  }


  const answer = await askModal({

    title:"تبدیل به MP3",

    text:
      `آهنگ «${song.title}» به MP3 تبدیل می‌شود.\n\n` +
      "تبدیل روی GitHub Actions انجام می‌شود و ممکن است کمی زمان ببرد.\n\n" +
      "شروع تبدیل؟",

    icon:"bi-arrow-repeat",

    buttons:[

      {
        text:"لغو",
        class:"",
        value:false
      },

      {
        text:"بله، تبدیل کن",
        class:"mint",
        value:true
      }

    ]

  });


  if(!answer){
    return;
  }


  try{

    song.converting = true;

    renderSongs();


    /*
      Output filename
    */

    const sourceName =
      song.repoPath.split("/").pop();

    const dot =
      sourceName.lastIndexOf(".");

    const base =
      dot > 0
        ? sourceName.slice(0,dot)
        : sourceName;

    const outputName =
      `${base}.mp3`;

    const outputPath =
      `${C.folder}/${outputName}`;


    /*
      Trigger GitHub Actions
    */

    await github(
      `/repos/${C.owner}/${C.repo}/actions/workflows/${C.workflow}/dispatches`,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          ref:C.branch,

          inputs:{
            source:song.repoPath,
            output:outputPath
          }

        })

      }
    );


    toast(
      "تبدیل شروع شد. منتظر پایان عملیات باشید...",
      "info"
    );


    /*
      Poll for converted MP3
    */

    const result =
      await waitForConvertedFile(
        outputPath,
        8 * 60 * 1000
      );


    if(!result){

      throw new Error(
        "تبدیل در زمان تعیین‌شده تمام نشد. " +
        "ممکن است GitHub Actions هنوز در حال اجرا باشد."
      );

    }


    const mp3Url =
      `https://${C.owner}.github.io/${C.repo}/${C.folder}/${encodeURIComponent(outputName)}`;


    /*
      Save converted information in Gist
    */

    song.converted = true;

    song.convertedUrl = mp3Url;

    song.convertedPath = outputPath;

    song.convertedAt =
      new Date().toISOString();


    /*
      The song now uses the MP3 URL.
    */

    await saveSongs();


    toast(
      "تبدیل به MP3 با موفقیت انجام شد.",
      "ok"
    );


  }catch(error){

    console.error(error);

    await alertModal(
      "خطا در تبدیل",
      error.message,
      "error"
    );

  }finally{

    song.converting = false;

    renderSongs();

  }

}


async function waitForConvertedFile(
  path,
  timeout
){

  const started = Date.now();

  while(Date.now() - started < timeout){

    try{

      const data = await github(
        `/repos/${C.owner}/${C.repo}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(C.branch)}`
      );

      if(data?.download_url || data?.sha){

        return true;
      }

    }catch{}

    await sleep(5000);

  }

  return false;
}


/* =========================================================
   CUSTOM AUDIO PLAYER
========================================================= */

let activePlayer = null;


function formatTime(seconds){

  if(!Number.isFinite(seconds)){
    return "00:00";
  }

  seconds = Math.max(
    0,
    Math.floor(seconds)
  );

  const min =
    Math.floor(seconds / 60);

  const sec =
    seconds % 60;

  return (
    String(min).padStart(2,"0") +
    ":" +
    String(sec).padStart(2,"0")
  );
}


function createPlayer(song,index){

  const url =
    song.converted && song.convertedUrl
      ? song.convertedUrl
      : song.url;

  const id =
    "player_" +
    String(index) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8);

  return `

    <div
      class="player"
      id="${id}"
      data-url="${escapeHtml(url)}"
    >

      <audio
        preload="metadata"
        src="${escapeHtml(url)}"
      ></audio>

      <div class="playerControls">

        <button
          class="playBtn"
          onclick="togglePlayer('${id}')"
        >
          <i class="bi bi-play-fill"></i>
        </button>

        <div class="playerTime">
          <span class="current">00:00</span>
          /
          <span class="duration">00:00</span>
        </div>

        <input
          class="seek"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          oninput="seekPlayer('${id}',this.value)"
        >

        <i class="bi bi-volume-up" style="color:var(--muted)"></i>

        <input
          class="volume"
          type="range"
          min="0"
          max="1"
          value="1"
          step="0.01"
          oninput="volumePlayer('${id}',this.value)"
        >

      </div>

      <div class="playerBottom">

        <div class="playerStatus">
          پخش‌کننده HPanel
        </div>

        <button
          class="btn"
          style="min-height:32px;padding:5px 9px;font-size:11px"
          onclick="restartPlayer('${id}')"
        >
          <i class="bi bi-arrow-counterclockwise"></i>
          از اول
        </button>

      </div>

    </div>

  `;


  /*
    Audio events are attached after rendering.
  */
}


function getPlayer(id){

  const box = document.getElementById(id);

  if(!box)return null;

  return {
    box,
    audio:box.querySelector("audio"),
    play:box.querySelector(".playBtn i"),
    current:box.querySelector(".current"),
    duration:box.querySelector(".duration"),
    seek:box.querySelector(".seek")
  };

}


function setupPlayers(){

  document
    .querySelectorAll(".player")
    .forEach(box=>{

      const p =
        getPlayer(box.id);

      if(!p)return;

      p.audio.addEventListener(
        "loadedmetadata",
        ()=>{
          p.duration.textContent =
            formatTime(p.audio.duration);
        }
      );

      p.audio.addEventListener(
        "timeupdate",
        ()=>{

          p.current.textContent =
            formatTime(p.audio.currentTime);

          if(p.audio.duration){

            p.seek.value =
              (
                p.audio.currentTime /
                p.audio.duration
              ) * 100;

          }

        }
      );

      p.audio.addEventListener(
        "play",
        ()=>{
          p.play.className =
            "bi bi-pause-fill";
        }
      );

      p.audio.addEventListener(
        "pause",
        ()=>{
          p.play.className =
            "bi bi-play-fill";
        }
      );

      p.audio.addEventListener(
        "ended",
        ()=>{
          p.play.className =
            "bi bi-play-fill";

          p.seek.value = 0;
        }
      );

      p.audio.addEventListener(
        "error",
        ()=>{
          toast(
            "پخش این فایل ممکن نیست.",
            "err"
          );
        }
      );

    });

}


function togglePlayer(id){

  const p = getPlayer(id);

  if(!p)return;


  /*
    Stop another active player.
  */

  if(activePlayer && activePlayer !== p.audio){

    try{
      activePlayer.pause();
    }catch{}

  }


  activePlayer = p.audio;


  if(p.audio.paused){

    p.audio.play().catch(()=>{
      toast(
        "مرورگر اجازه پخش خودکار را نداد.",
        "err"
      );
    });

  }else{

    p.audio.pause();

  }

}


function seekPlayer(id,value){

  const p = getPlayer(id);

  if(!p)return;

  if(Number.isFinite(p.audio.duration)){

    p.audio.currentTime =
      p.audio.duration *
      (Number(value) / 100);

  }

}


function volumePlayer(id,value){

  const p = getPlayer(id);

  if(!p)return;

  p.audio.volume =
    Math.max(
      0,
      Math.min(1,Number(value))
    );

}


function restartPlayer(id){

  const p = getPlayer(id);

  if(!p)return;

  p.audio.currentTime = 0;

  p.audio.play().catch(()=>{});

}


/* =========================================================
   SONG RENDERING
========================================================= */

function renderSongs(){

  const list = $("songsList");

  if(!list)return;


  const search =
    ($("searchInput")?.value || "")
      .trim()
      .toLowerCase();


  let visible = songs.filter(song=>{

    if(!search)return true;

    return String(song.title || "")
      .toLowerCase()
      .includes(search);

  });


  if(!visible.length){

    list.innerHTML = `

      <div class="empty">

        <i class="bi bi-music-note"></i>

        ${
          songs.length
            ? "آهنگی با این جستجو پیدا نشد."
            : "هنوز هیچ آهنگی اضافه نشده است."
        }

      </div>

    `;

    return;
  }


  list.innerHTML =
    visible
      .map(song=>{

        const index =
          songs.indexOf(song);

        return renderSong(song,index);

      })
      .join("");


  setupPlayers();

}


function renderSong(song,index){

  const source =
    song.format === "mp3"
      ? "MP3"
      : song.converted
        ? "MP3 آماده"
        : "غیر MP3";

    song.format === "mp3"
      ? "mp3"
      : song.converted
        ? "converted"
        : "";


  const playUrl =
    song.converted && song.convertedUrl
      ? song.convertedUrl
      : song.format === "mp3"
        ? song.url
        : "";


  let player = "";

  if(playUrl){

    player =
      createPlayer(
        song,
        index
      );

  }else{

    player = `

      <div
        class="player"
        style="text-align:center;color:var(--muted)"
      >

        <div>
          برای پخش، ابتدا فایل را به MP3 تبدیل کنید.
        </div>

      </div>

    `;

  }


  let convertButton = "";


  if(
    song.format !== "mp3" &&
    !song.converted
  ){

    convertButton = `

      <button
        class="btn mint"
        onclick="convertSong(${index})"
        ${song.converting ? "disabled" : ""}
      >

        <i class="bi bi-arrow-repeat"></i>

        ${
          song.converting
            ? "در حال تبدیل..."
            : "تبدیل به MP3"
        }

      </button>

    `;

  }


  return `

    <article class="song">

      <div class="songTop">

        <div style="min-width:0">

          <div class="songTitle">
            ${escapeHtml(song.title || "بدون عنوان")}
          </div>

          <div class="songMeta">

            حجم:
            ${formatBytes(song.size || 0)}

            •

            اضافه شده:
            ${formatDate(song.added)}

            ${
              song.converted
                ? " • تبدیل شده به MP3"
                : ""
            }

          </div>

        </div>

        <div
          class="formatBadge ${badgeClass}"
        >
          ${source}
        </div>

      </div>

      ${player}

      <div class="songActions">

        ${convertButton}

        <button
          class="btn"
          onclick="copySongUrl(${index})"
        >
          <i class="bi bi-link-45deg"></i>
          کپی لینک
        </button>

        <button
          class="btn"
          onclick="openSong(${index})"
        >
          <i class="bi bi-box-arrow-up-right"></i>
          باز کردن
        </button>

        <button
          class="btn blue"
          onclick="editSong(${index})"
        >
          <i class="bi bi-pencil-square"></i>

                <i class="bi bi-trash3"></i>
                حذف

            `
            : ""
        }

      </div>

    </article>

  `;

}

  cancel.className = "btn";

  cancel.textContent = "لغو";

  cancel.onclick = ()=>{
    closeModal(false);
  };


  const save =
    document.createElement("button");

  save.className = "btn gold";

  save.innerHTML =
    `<i class="bi bi-check2"></i> ذخیره تغییرات`;

  save.onclick = async()=>{

    save.disabled = true;

    try{

      const title =
        $("editTitle").value.trim();

      const url =
        $("editUrl").value.trim();

      const size =
        Math.max(
          0,
          Number($("editSize").value || 0)
        );

      const added =
        fromDateTimeLocal(
          $("editAdded").value
        );


      if(!title){

        toast(
          "عنوان نمی‌تواند خالی باشد.",
          "err"
        );

        save.disabled = false;

        return;
      }


      if(!url){

        toast(
          "لینک فایل نمی‌تواند خالی باشد.",
          "err"
        );

        save.disabled = false;

        return;
      }


      song.title = title;

      song.url = url;

      song.size = size;

      song.added = added;


      if(
        song.converted &&
        $("editConvertedUrl")
      ){

        song.convertedUrl =
          $("editConvertedUrl")
            .value
            .trim();

      }


      await saveSongs();


      closeModal(true);

      renderSongs();

      toast(
        "اطلاعات آهنگ در Gist ذخیره شد.",
        "ok"
      );

    }catch(error){

      console.error(error);

      toast(
        "ذخیره تغییرات ناموفق بود: " +
        error.message,
        "err"
      );

      save.disabled = false;

    }

  };


  actions.appendChild(cancel);

  actions.appendChild(save);


  $("modalBack").style.display = "flex";


  /*
    This modal is custom HTML, not browser prompt().
  */

}


function toDateTimeLocal(value){

  if(!value)return "";

  const d =
    new Date(value);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  const pad =
    n=>String(n).padStart(2,"0");

  return (
    d.getFullYear() +
    "-" +
    pad(d.getMonth()+1) +
    "-" +
    pad(d.getDate()) +
    "T" +
    pad(d.getHours()) +
    ":" +
    pad(d.getMinutes())
  );

}


function fromDateTimeLocal(value){

  if(!value){
    return new Date().toISOString();
  }

  const d =
    new Date(value);

  return Number.isNaN(d.getTime())
    ? new Date().toISOString()
    : d.toISOString();

}

async function deleteSong(index){

  if(!admin){

    await alertModal(
      "دسترسی محدود",
      "فقط مدیر می‌تواند آهنگ‌ها را حذف کند.",
      "error"
    );

    return;
  }


  const song = songs[index];

  if(!song)return;


  const answer = await askModal({

    title:"حذف آهنگ",

    text:
      `آیا مطمئن هستید که می‌خواهید «${song.title}» را از فهرست Gist حذف کنید؟\n\n` +
      "توجه: این کار اطلاعات آهنگ را از Gist حذف می‌کند، " +
      "اما فایل موجود در مخزن را حذف نمی‌کند.",

    icon:"bi-trash3",

    buttons:[

      {
        text:"لغو",
        class:"",
        value:false
      },

      {
        text:"حذف",
        class:"rose",
        value:true
      }

    ]

  });


  if(!answer)return;


  try{

    songs.splice(index,1);

    await saveSongs();

    renderSongs();

    toast(
      "آهنگ از Gist حذف شد.",
      "ok"
    );

  }catch(error){

    console.error(error);

    await loadSongs();

    renderSongs();

    await alertModal(
      "خطا",
      error.message,
      "error"
    );

  }

}

async function copySongUrl(index){

  const song = songs[index];

  if(!song)return;


  const url =
    song.converted && song.convertedUrl
      ? song.convertedUrl
      : song.url;


  try{

    await navigator.clipboard.writeText(url);

    toast(
      "لینک کپی شد.",
      "ok"
    );

  }catch{

    await alertModal(
      "کپی ناموفق بود",
      url
    );

  }

}


function openSong(index){

  const song = songs[index];

  if(!song)return;


  const url =
    song.converted && song.convertedUrl
      ? song.convertedUrl
      : song.url;


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}

      "در حال تازه‌سازی...",

    renderSongs();

    await alertModal(
      "خطا",
      error.message,
      "error"
    );

}

function formatBytes(bytes){

  if(!Number.isFinite(bytes) || bytes <= 0){
    return "۰ بایت";
  }

  const units =
    ["بایت","KB","MB","GB"];

  let i=0;
  let n=bytes;

  while(n >= 1024 && i < units.length-1){

    n/=1024;
    i++;

  }

  return (
    n.toFixed(i === 0 ? 0 : 1) +
    " " +
    units[i]
  );

}


function formatDate(value){

  if(!value){
    return "نامشخص";
  }

  const d =
    new Date(value);

  if(Number.isNaN(d.getTime())){
    return "نامشخص";
  }

  try{

    return d.toLocaleDateString(
      "fa-IR"
    );

  }catch{

    return d.toLocaleDateString();

  }

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}

async function init(){

  const a = getAuth();


  /*
    EXACT HPanel AUTH FORMAT
  */

  if(!a?.loggedIn){

    location.href =
      C.vaultUrl;

    return;
  }


  admin = !!a.admin;


  /*
    Recover token either from the dedicated
    localStorage key or from hpanel_vault_items.
  */

  token =
    recoverRadioToken();


  /*
    IMPORTANT:
    Do NOT redirect here.
    This prevents the redirect loop.
  */

  if(!token){

    showTokenError();

    return;
  }


  try{

    await loadSongs();

    renderApp();

  }catch(error){

    console.error(error);

    $("appContent").innerHTML = `

      <div class="section">

        <div class="errorPanel">

          <i class="bi bi-cloud-slash"></i>

          <h2>
            خطا در اتصال به GitHub
          </h2>

          <p class="hint">
            ${escapeHtml(error.message)}
          </p>

          <button
            class="btn gold"
            onclick="location.reload()"
          >
            <i class="bi bi-arrow-clockwise"></i>
            تلاش دوباره
          </button>

        </div>

      </div>

    `;

  }

}


init();
