<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HerculePanel Radio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>
:root{
--bg:#0b0a09;
--text:#fff6ea;
--muted:#c3b09a;
--line:rgba(255,186,92,.22);
--gold:#ffb43a;
--mint:#3ee39a;
--ink:#140f0a
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Lalezar,Tahoma;
color:var(--text);
background:
radial-gradient(circle at 12% 0%,rgba(255,180,58,.23),transparent 32%),
radial-gradient(circle at 88% 30%,rgba(62,227,154,.11),transparent 30%),
linear-gradient(180deg,#120e0b,#070605)
}

.wrap{
width:min(1000px,calc(100% - 30px));
margin:auto;
padding:35px 0 70px
}

.head{
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
flex-wrap:wrap
}

.brand{font-size:32px}
.gold{color:var(--gold)}

.badge{
display:inline-block;
padding:5px 10px;
border-radius:999px;
background:rgba(62,227,154,.15);
color:var(--mint)
}

.panel{
margin-top:16px;
padding:15px;
border-radius:18px;
border:1px solid var(--line);
background:linear-gradient(
145deg,
rgba(255,255,255,.085),
rgba(255,180,58,.045),
rgba(255,255,255,.025)
);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.07),
0 18px 45px rgba(0,0,0,.18)
}

.btn{
border:0;
cursor:pointer;
border-radius:15px;
padding:9px 13px;
font:15px Lalezar;
margin:4px;
box-shadow:0 5px 0 rgba(0,0,0,.3)
}

.mint{
background:linear-gradient(180deg,#6af3b8,#17c77a);
color:#042016
}

.goldbtn{
background:linear-gradient(180deg,#ffd27a,#ff9d1f);
color:var(--ink)
}

.rose{
background:linear-gradient(180deg,#ff8a97,#e23b4d);
color:#fff
}

.home{
background:linear-gradient(180deg,#8ab0ff,#4d7dff);
color:#061018;
text-decoration:none
}

.ghost{
background:rgba(255,255,255,.06);
color:var(--text);
border:1px solid var(--line);
box-shadow:none
}

input{
width:100%;
padding:10px;
border-radius:13px;
border:1px solid var(--line);
background:rgba(255,255,255,.055);
backdrop-filter:blur(10px);
color:var(--text);
font:14px Lalezar
}

input[type=file]{
padding:8px;
cursor:pointer
}

input[type=file]::file-selector-button{
border:1px solid rgba(255,186,92,.35);
border-radius:10px;
padding:7px 11px;
margin-inline-end:9px;
background:linear-gradient(180deg,#ffd27a,#ff9d1f);
color:#140f0a;
font:14px Lalezar;
cursor:pointer;
transition:all .5s cubic-bezier(.22,1,.36,1)
}

input[type=file]::file-selector-button:hover{
transform:translateY(-2px);
box-shadow:0 7px 20px rgba(255,180,58,.22)
}

label{
display:block;
color:var(--gold);
margin:8px 0 5px
}

.song{
padding:14px;
margin:10px 0;
border-radius:16px;
background:rgba(255,255,255,.045);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
border:1px solid var(--line)
}

.song-title{
font-size:20px;
margin-bottom:4px
}

.song-info{
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap;
margin:7px 0
}

.format{
display:inline-block;
padding:3px 9px;
border-radius:999px;
font-size:12px;
background:rgba(255,180,58,.13);
color:var(--gold)
}

.format.mp3{
background:rgba(62,227,154,.13);
color:var(--mint)
}

.url{
direction:ltr;
text-align:left;
word-break:break-all;
color:var(--muted);
font-family:monospace;
font-size:12px;
margin:8px 0
}

/* Custom audio player */

.player{
width:100%;
padding:10px;
border-radius:15px;
border:1px solid var(--line);
background:
linear-gradient(
145deg,
rgba(255,255,255,.07),
rgba(255,180,58,.035)
);
margin:10px 0
}

.player-top{
display:flex;
align-items:center;
gap:10px
}

.play-btn{
width:46px;
height:46px;
border-radius:14px;
border:1px solid rgba(255,186,92,.28);
background:linear-gradient(180deg,#ffd27a,#ff9d1f);
color:#140f0a;
font-size:20px;
cursor:pointer;
box-shadow:0 5px 0 rgba(0,0,0,.25);
flex-shrink:0
}

.player-main{
flex:1;
min-width:0
}

.player-name{
font-size:15px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.player-time{
color:var(--muted);
font-size:12px;
direction:ltr;
text-align:left;
margin-top:2px
}

.seek{
width:100%;
height:8px;
margin-top:8px;
appearance:none;
-webkit-appearance:none;
border-radius:999px;
background:#211a12;
outline:none;
padding:0;
border:0
}

.seek::-webkit-slider-thumb{
appearance:none;
-webkit-appearance:none;
width:16px;
height:16px;
border-radius:50%;
background:var(--gold);
cursor:pointer;
box-shadow:0 0 0 3px rgba(255,180,58,.15)
}

.seek::-moz-range-thumb{
width:16px;
height:16px;
border-radius:50%;
border:0;
background:var(--gold);
cursor:pointer
}

.volume{
width:90px;
height:7px;
appearance:none;
-webkit-appearance:none;
border-radius:999px;
background:#211a12;
padding:0;
border:0
}

.volume::-webkit-slider-thumb{
appearance:none;
-webkit-appearance:none;
width:13px;
height:13px;
border-radius:50%;
background:var(--mint);
cursor:pointer
}

.volume::-moz-range-thumb{
width:13px;
height:13px;
border-radius:50%;
border:0;
background:var(--mint);
cursor:pointer
}

.player-bottom{
display:flex;
align-items:center;
gap:9px;
margin-top:8px;
flex-wrap:wrap
}

.modal{
position:fixed;
inset:0;
background:rgba(8,6,4,.62);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
display:flex;
align-items:center;
justify-content:center;
z-index:10;
opacity:1;
animation:modalIn .55s cubic-bezier(.22,1,.36,1)
}

.modal.closing{
animation:modalOut .5s cubic-bezier(.55,0,.78,.18) forwards
}

.modal.hidden{display:none}

.modalbox{
width:min(550px,calc(100% - 30px));
padding:20px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(22,17,12,.72);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
box-shadow:
0 28px 80px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.08);
animation:boxIn .6s cubic-bezier(.22,1,.36,1)
}

.modal.closing .modalbox{
animation:boxOut .45s cubic-bezier(.55,0,.78,.18) forwards
}

@keyframes modalIn{
from{opacity:0}
to{opacity:1}
}

@keyframes modalOut{
from{opacity:1}
to{opacity:0}
}

@keyframes boxIn{
from{
opacity:0;
transform:translateY(18px) scale(.96)
}
to{
opacity:1;
transform:none
}
}

@keyframes boxOut{
to{
opacity:0;
transform:translateY(16px) scale(.96)
}
}

.hidden{
display:none!important
}

.loading{
text-align:center;
color:var(--muted)
}

.bar{
height:12px;
border-radius:999px;
background:#1b1711;
overflow:hidden;
margin-top:8px
}

.fill{
height:100%;
width:0;
background:linear-gradient(90deg,var(--gold),var(--mint));
transition:width .25s ease
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translate(-50%,22px) scale(.96);
padding:12px 18px;
border-radius:14px;
background:rgba(23,18,13,.68);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid var(--line);
box-shadow:
0 18px 45px rgba(0,0,0,.35),
inset 0 1px 0 rgba(255,255,255,.08);
opacity:0;
animation:toastIn .55s cubic-bezier(.22,1,.36,1) forwards;
z-index:200
}

.toast.hide{
animation:toastOut .55s cubic-bezier(.55,0,.78,.18) forwards
}

@keyframes toastIn{
to{
opacity:1;
transform:translate(-50%,0) scale(1)
}
}

@keyframes toastOut{
to{
opacity:0;
transform:translate(-50%,18px) scale(.94)
}
}

.ok{color:#9dffc9}
.err{color:#ffb0b7}

.spin{
display:inline-block;
width:16px;
height:16px;
border:2px solid rgba(0,0,0,.25);
border-top-color:#111;
border-radius:50%;
animation:s .7s linear infinite
}

@keyframes s{
to{transform:rotate(360deg)}
}

button,a,input{
transition:
transform .5s cubic-bezier(.22,1,.36,1),
opacity .5s ease,
border-color .5s ease,
box-shadow .5s ease,
background .5s ease
}

button:not(:disabled):hover,
a.btn:hover{
transform:translateY(-3px)
}

button:disabled{
opacity:.55;
cursor:not-allowed
}

.busy{
position:fixed;
inset:auto 50% 18px auto;
transform:translateX(50%);
display:flex;
align-items:center;
gap:8px;
padding:9px 14px;
border:1px solid var(--line);
border-radius:13px;
background:rgba(20,15,10,.92);
backdrop-filter:blur(10px);
z-index:50;
box-shadow:0 8px 30px #0008
}

.busy.hidden{display:none}

/* Dialog */

.custom-dialog{
position:fixed;
inset:0;
background:rgba(8,6,4,.68);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
display:flex;
align-items:center;
justify-content:center;
z-index:150;
animation:dialogIn .35s cubic-bezier(.22,1,.36,1)
}

.custom-dialog.hidden{
display:none
}

.custom-dialog.closing{
animation:dialogOut .3s cubic-bezier(.55,0,.78,.18) forwards
}

.custom-dialog-box{
width:min(500px,calc(100% - 30px));
padding:21px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(22,17,12,.78);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
box-shadow:
0 28px 80px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.08);
animation:dialogBoxIn .4s cubic-bezier(.22,1,.36,1)
}

.custom-dialog.closing .custom-dialog-box{
animation:dialogBoxOut .3s cubic-bezier(.55,0,.78,.18) forwards
}

.dialog-title{
margin:0 0 8px;
font-size:23px
}

.dialog-message{
color:var(--muted);
line-height:1.9;
white-space:pre-wrap
}

.dialog-icon{
font-size:25px;
vertical-align:-.12em;
margin-inline-end:7px
}

.dialog-actions{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:17px
}

@keyframes dialogIn{
from{opacity:0}
to{opacity:1}
}

@keyframes dialogOut{
from{opacity:1}
to{opacity:0}
}

@keyframes dialogBoxIn{
from{
opacity:0;
transform:translateY(18px) scale(.96)
}
to{
opacity:1;
transform:none
}
}

@keyframes dialogBoxOut{
to{
opacity:0;
transform:translateY(16px) scale(.96)
}
}

/* Footer */

.footer{
text-align:center;
color:var(--muted);
margin-top:30px;
font-size:13px;
line-height:1.8
}

.footer-brand{
font-size:23px;
color:var(--text)
}

.footer-brand .gold{
color:var(--gold)
}
</style>
</head>

<body>

<div class="wrap">

<div class="head">

<div>
<div class="brand">

<script>

const C={
owner:"HerculePanel",
repo:"HPanelRadio",
branch:"main",
gist:"eb1b8cd10486738c06ed9cc12677b7e2",
file:"songs.json",
folder:"songs",
workflow:"convert.yml"
};

const AUTH="hpanel_auth";
const TK="hpanel_radio_token";
const ITEMS_KEY="hpanel_vault_items";

let token="";
let admin=false;
let songs=[];


/* ---------------- Auth ---------------- */

function getAuth(){
try{
return JSON.parse(localStorage.getItem(AUTH)||"null");
}catch{
return null;
}
}


function recoverRadioToken(){

let t=localStorage.getItem(TK)||"";

if(t)return t;

try{

const items=
JSON.parse(
localStorage.getItem(ITEMS_KEY)||"[]"
);

const x=items.find(x=>
x &&
x.token &&
String(x.name||"")
.toLowerCase()
.includes("radio")
);

if(x?.token){

localStorage.setItem(TK,x.token);

return x.token;

}

}catch{}

return "";
}


/* ---------------- UI ---------------- */

function busy(on,text="در حال انجام..."){

document.getElementById("busyText").textContent=text;

document
.getElementById("busy")
.classList
.toggle("hidden",!on);

}


function toast(t,c=""){

const x=document.createElement("div");

x.className="toast "+c;
x.textContent=t;

document.body.appendChild(x);

setTimeout(()=>{

x.classList.add("hide");

setTimeout(()=>x.remove(),550);

},3000);

}


/* ---------------- Dialog ---------------- */

function closeCustomDialog(){

const d=document.getElementById("customDialog");

if(d.classList.contains("hidden"))return;

d.classList.add("closing");

setTimeout(()=>{

d.classList.add("hidden");
d.classList.remove("closing");

},300);

}


function customAlert(
message,
title="پیام",
type="info"
){

return new Promise(resolve=>{

const d=document.getElementById("customDialog");
const t=document.getElementById("dialogTitle");
const m=document.getElementById("dialogMessage");
const a=document.getElementById("dialogActions");

const icons={
info:"bi-info-circle",
success:"bi-check-circle",
error:"bi-exclamation-triangle",
warning:"bi-exclamation-triangle"
};

const buttonClass=
type==="error"||type==="warning"
?"rose"
:"mint";

t.innerHTML=
`<i class="bi ${icons[type]||icons.info} dialog-icon"></i>${esc(title)}`;

m.textContent=message;

a.innerHTML=`
<button class="btn ${buttonClass}" id="dialogOK">
<i class="bi bi-check-lg"></i>
باشه
</button>
`;

d.classList.remove("hidden","closing");

document.getElementById("dialogOK").onclick=()=>{

closeCustomDialog();

setTimeout(()=>resolve(),300);

};

});

}


function customConfirm(
message,
title="تأیید"
){

return new Promise(resolve=>{

const d=document.getElementById("customDialog");
const t=document.getElementById("dialogTitle");
const m=document.getElementById("dialogMessage");
const a=document.getElementById("dialogActions");

t.innerHTML=
`<i class="bi bi-question-circle dialog-icon"></i>${esc(title)}`;

m.textContent=message;

a.innerHTML=`

<button class="btn mint" id="dialogYes">
<i class="bi bi-check-lg"></i>
بله
</button>

<button class="btn ghost" id="dialogNo">
<i class="bi bi-x-lg"></i>
خیر
</button>

`;

d.classList.remove("hidden","closing");

document.getElementById("dialogYes").onclick=()=>{

closeCustomDialog();

setTimeout(()=>resolve(true),300);

};

document.getElementById("dialogNo").onclick=()=>{

closeCustomDialog();

setTimeout(()=>resolve(false),300);

};

});

}


/* ---------------- GitHub API ---------------- */

function api(path,opt={}){

return fetch(
"https://api.github.com"+path,
{
...opt,
headers:{
"Accept":"application/vnd.github+json",
"X-GitHub-Api-Version":"2022-11-28",
"Authorization":"Bearer "+token,
...(opt.headers||{})
}
}
);

}


async function json(path,opt={}){

const r=await api(path,opt);

const d=await r.json().catch(()=>null);

if(!r.ok)
throw Error(
d?.message ||
"GitHub API "+r.status
);

return d;

}


/* ---------------- Helpers ---------------- */

function esc(s){

return String(s??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function publicUrl(n){

return `https://${C.owner}.github.io/${C.repo}/${C.folder}/${encodeURIComponent(n)}`;

}


function isMp3File(file){

if(!file)return false;

const name=
String(file.name||"")
.trim()
.toLowerCase();

return name.endsWith(".mp3");

}


function isMp3Url(url){

try{

const u=new URL(url);

const pathname=
u.pathname
.split("?")[0]
.split("#")[0]
.toLowerCase();

return pathname.endsWith(".mp3");

}catch{

return false;

}

}


function getExtension(name){

const n=String(name||"");

const p=n.lastIndexOf(".");

if(p<0)return "";

return n.slice(p+1).toLowerCase();

}


function safeFileName(name){

return String(name||"file")
.replace(/[\\/:*?"<>|]/g,"_")
.replace(/\s+/g,"_");

}


/* ---------------- Gist ---------------- */

async function saveGist(){

await json(
"/gists/"+C.gist,
{
method:"PATCH",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
files:{
[C.file]:{
content:JSON.stringify(
{songs},
null,
2
)
}
}
})
}
);

}


/* ---------------- Songs ---------------- */

async function loadSongs(){

busy(true,"در حال بارگذاری آهنگ‌ها...");

try{

const d=await json("/gists/"+C.gist);

const f=d.files?.[C.file];

songs=f
?JSON.parse(
f.content||'{"songs":[]}'
).songs||[]
:[];

render();

}finally{

busy(false);

}

}


function render(){

const box=document.getElementById("songs");

if(!songs.length){

box.innerHTML=`
<p>
<i class="bi bi-music-note"></i>
هنوز آهنگی نیست.
</p>
`;

return;

}

box.innerHTML=songs.map((s,i)=>{

const mp3=
isMp3Url(s.url) ||
String(s.format||"").toLowerCase()==="mp3";

const converting=!!s.converting;

return `

<div class="song">

<div class="song-title">
<i class="bi bi-music-note-beamed"></i>
${esc(s.title||"بدون عنوان")}
</div>

<div class="song-info">

<span class="format ${mp3?"mp3":""}">
<i class="bi ${mp3?"bi-file-earmark-music":"bi-file-earmark"}"></i>
${mp3?"MP3":"غیر MP3"}
</span>

${
converting
?
`<span class="format">
<i class="bi bi-arrow-repeat"></i>
در حال تبدیل...
</span>`
:""
}

</div>


<div class="player">

<div class="player-top">

<button
class="play-btn"
id="play-${i}"
onclick="togglePlay(${i})"
>
<i class="bi bi-play-fill"></i>
</button>

<div class="player-main">

<div class="player-name">
${esc(s.title||"بدون عنوان")}
</div>

<div class="player-time">
<span id="current-${i}">00:00</span>
/
<span id="duration-${i}">00:00</span>
</div>

</div>

</div>

<input
id="seek-${i}"
class="seek"
type="range"
min="0"
max="100"
value="0"
step="0.1"
oninput="seekAudio(${i},this.value)"
>

<div class="player-bottom">

<i class="bi bi-volume-up"></i>

<input
class="volume"
type="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="setVolume(${i},this.value)"
>

</div>

<audio
id="audio-${i}"
preload="metadata"
src="${esc(s.url)}"
onloadedmetadata="audioLoaded(${i})"
ontimeupdate="audioTime(${i})"
onended="audioEnded(${i})"
onerror="audioError(${i})"
></audio>

</div>


<div class="url">
${esc(s.url)}
</div>


<div>

<button
class="btn goldbtn"
onclick="copy(${i})"
>
<i class="bi bi-clipboard"></i>
کپی لینک
</button>

<a
class="btn ghost"
href="${esc(s.url)}"
target="_blank"
rel="noopener"
>
<i class="bi bi-box-arrow-up-right"></i>
باز کردن
</a>

<button
class="btn mint"
onclick="openEdit(${i})"
>
<i class="bi bi-pencil-square"></i>
ویرایش
</button>

${
!mp3 && !converting
?
`
<button
class="btn goldbtn"
onclick="convertSong(${i})"
>
<i class="bi bi-filetype-mp3"></i>
تبدیل به MP3
</button>
`
:""
}

<button
class="btn rose"
onclick="del(${i})"
>
<i class="bi bi-trash3"></i>
حذف
</button>

</div>

</div>

`;

}).join("");

}


/* ---------------- Custom Player ---------------- */

function getAudio(i){

return document.getElementById("audio-"+i);

}


function togglePlay(i){

const audio=getAudio(i);

if(!audio)return;

if(audio.paused){

document.querySelectorAll("audio").forEach(x=>{

if(x!==audio)x.pause();

});

audio.play().catch(()=>{

toast("پخش آهنگ ممکن نیست","err");

});

}else{

audio.pause();

}

updatePlayButton(i);

}


function updatePlayButton(i){

const audio=getAudio(i);
const btn=document.getElementById("play-"+i);

if(!audio||!btn)return;

btn.innerHTML=
audio.paused
?
'<i class="bi bi-play-fill"></i>'
:
'<i class="bi bi-pause-fill"></i>';

}


function audioLoaded(i){

const audio=getAudio(i);

if(!audio)return;

const d=document.getElementById("duration-"+i);

d.textContent=formatTime(audio.duration);

}


function audioTime(i){

const audio=getAudio(i);

if(!audio)return;

const seek=document.getElementById("seek-"+i);
const current=document.getElementById("current-"+i);

if(audio.duration){

seek.value=
(audio.currentTime/audio.duration)*100;

}

current.textContent=
formatTime(audio.currentTime);

updatePlayButton(i);

}


function audioEnded(i){

const seek=document.getElementById("seek-"+i);

if(seek)seek.value=0;

updatePlayButton(i);

}


function audioError(i){

console.warn(
"Audio failed:",
songs[i]?.url
);

}


function seekAudio(i,value){

const audio=getAudio(i);

if(!audio||!audio.duration)return;

audio.currentTime=
(Number(value)/100)*audio.duration;

}


function setVolume(i,value){

const audio=getAudio(i);

if(audio)
audio.volume=Number(value);

}


function formatTime(sec){

if(!Number.isFinite(sec))
return "00:00";

sec=Math.max(0,Math.floor(sec));

const m=
Math.floor(sec/60)
.toString()
.padStart(2,"0");

const s=
(sec%60)
.toString()
.padStart(2,"0");

return `${m}:${s}`;

}


/* ---------------- Add ---------------- */

function openAdd(){

document
.getElementById("modal")
.classList
.remove("hidden","closing");

}


function closeAdd(){

const m=document.getElementById("modal");

if(m.classList.contains("hidden"))
return;

m.classList.add("closing");

setTimeout(()=>{

m.classList.add("hidden");
m.classList.remove("closing");

},500);

}


function resetAdd(){

document.getElementById("title").value="";
document.getElementById("file").value="";
document.getElementById("url").value="";
document.getElementById("fill").style.width="0%";

}


/* ---------------- Base64 ---------------- */

function b64(file){

return new Promise((res,rej)=>{

const r=new FileReader();

r.onload=()=>{
res(
String(r.result)
.split(",")[1]
);
};

r.onerror=rej;

r.readAsDataURL(file);

});

}


/* ---------------- Upload To Repo ---------------- */

async function uploadFileToRepo(file){

const safeName=safeFileName(file.name);

const path=
C.folder+"/"+safeName;

const content=
await b64(file);

document.getElementById("fill").style.width="30%";

const result=await json(
"/repos/"+C.owner+"/"+C.repo+
"/contents/"+
encodeURIComponent(path)
.replace(/%2F/g,"/"),
{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:"Add audio "+safeName,
content,
branch:C.branch
})
}
);

document.getElementById("fill").style.width="100%";

return {
path,
name:safeName,
url:publicUrl(safeName),
sha:result.content?.sha||""
};

}


/* ---------------- Add Song ---------------- */

async function saveSong(){

const title=
document.getElementById("title")
.value
.trim();

const file=
document.getElementById("file")
.files[0];

let url=
document.getElementById("url")
.value
.trim();


if(!title){

toast("عنوان را بنویس","err");
return;

}

if(!file&&!url){

toast("فایل یا لینک را وارد کن","err");
return;

}


/*
IMPORTANT:
For uploaded files we determine MP3
using the filename extension, NOT the browser MIME.
This prevents browsers incorrectly reporting
audio files as audio/mpeg.
*/

if(file){

if(file.size>20*1024*1024){

toast(
"حجم فایل باید کمتر از ۲۰ مگابایت باشد",
"err"
);

return;

}

const mp3=isMp3File(file);


/*
Non-MP3 confirmation happens BEFORE upload.
*/

if(!mp3){

const yes=await customConfirm(

"این فایل یک فایل MP3 نیست.\n\n"+
"این فایل نمی‌تواند مستقیماً در بازی نوشته شود.\n\n"+
"تبدیل فایل به MP3 بعد از آپلود از داخل همین وب‌سایت امکان‌پذیر است.\n\n"+
"آیا می‌خواهید با آپلود فایل ادامه دهید؟",

"فایل MP3 نیست",

);

if(!yes)return;

}


/*
Now upload to the repository FIRST.
*/

busy(
true,
mp3
?
"در حال آپلود فایل MP3 به مخزن..."
:
"در حال آپلود فایل به مخزن..."
);

try{

const uploaded=
await uploadFileToRepo(file);


/*
Only AFTER GitHub confirms the upload,
add it to the Gist.
*/

songs.push({

title,
url:uploaded.url,
size:file.size,
added:new Date().toISOString(),
format:mp3?"mp3":"source",
sourceFile:uploaded.path,
converting:false

});

busy(
true,
"فایل در مخزن قرار گرفت؛ در حال ذخیره اطلاعات..."
);

await saveGist();

render();

closeAdd();
resetAdd();

toast(
mp3
?
"فایل MP3 با موفقیت آپلود شد"
:
"فایل آپلود شد؛ حالا می‌توانید آن را به MP3 تبدیل کنید",
"ok"
);

}catch(e){

toast(e.message,"err");

}finally{

busy(false);

}

return;

}


/*
URL mode.
*/

if(!/^https?:\/\//i.test(url)){

toast("لینک نامعتبر است","err");
return;

}

const mp3=isMp3Url(url);

if(!mp3){

const yes=await customConfirm(

"این لینک به یک فایل MP3 ختم نمی‌شود.\n\n"+
"این فایل احتمالاً نمی‌تواند مستقیماً در بازی استفاده شود.\n\n"+
"تبدیل فایل به MP3 بعد از اضافه شدن امکان‌پذیر است.\n\n"+
"آیا می‌خواهید ادامه دهید؟",

"لینک MP3 نیست"
);

if(!yes)return;

}

busy(true,"در حال ذخیره لینک...");

try{

songs.push({

title,
url,
size:0,
added:new Date().toISOString(),
format:mp3?"mp3":"source",
converting:false

});

await saveGist();

render();

closeAdd();
resetAdd();

toast(
mp3
?
"لینک MP3 ذخیره شد"
:
"لینک ذخیره شد",
"ok"
);

}catch(e){

toast(e.message,"err");

}finally{

busy(false);

}

}


/* ---------------- Convert ---------------- */

async function convertSong(i){

const s=songs[i];

if(!s)return;

if(
isMp3Url(s.url) ||
String(s.format||"").toLowerCase()==="mp3"
){

toast("این آهنگ از قبل MP3 است","ok");
return;

}


if(s.converting){

toast("این آهنگ در حال تبدیل است","err");
return;

}


/*
The source must be a file in our repository.
*/

if(!s.sourceFile){

await customAlert(

"برای این آهنگ مسیر فایل اصلی در مخزن ثبت نشده است.\n\n"+
"اگر فایل واقعاً داخل مخزن است، ابتدا آن را با دکمه ویرایش بررسی کنید.",

"امکان تبدیل نیست",
"error"

);

return;

}


const source=
s.sourceFile;

const base=
source
.split("/")
.pop()
.replace(/\.[^/.]+$/,"");

const output=
C.folder+
"/"+
safeFileName(base)+
"_converted.mp3";


const yes=await customConfirm(

"فایل اصلی در مخزن قرار دارد.\n\n"+
"GitHub Actions آن را با FFmpeg به MP3 تبدیل می‌کند.\n\n"+
"پس از اتمام، لینک آهنگ در Gist به فایل MP3 تغییر خواهد کرد.\n\n"+
"ادامه می‌دهید؟",

"تبدیل به MP3"

);

if(!yes)return;


s.converting=true;

render();

await saveGist();

busy(
true,
"در حال شروع تبدیل در GitHub..."
);

try{

await json(
"/repos/"+C.owner+"/"+C.repo+
"/actions/workflows/"+
C.workflow+
"/dispatches",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

ref:C.branch,

inputs:{
source,
output
}

})
}
);

busy(
true,
"تبدیل شروع شد؛ منتظر MP3 هستیم..."
);


/*
Wait until Actions creates the output.
*/

const exists=
await waitForFile(
output,
8*60*1000
);

if(!exists){

throw Error(
"تبدیل انجام نشد یا فایل خروجی در زمان تعیین‌شده پیدا نشد"
);

}


/*
Conversion succeeded.
Update Gist data.
*/

s.url=publicUrl(
output.split("/").pop()
);

s.format="mp3";

s.converting=false;

s.convertedAt=
new Date().toISOString();

s.convertedFile=output;

await saveGist();

render();

toast(
"تبدیل به MP3 با موفقیت انجام شد",
"ok"
);

}catch(e){

s.converting=false;

try{
await saveGist();
}catch{}

render();

toast(
e.message||"خطا در تبدیل",
"err"
);

}finally{

busy(false);

}

}


/* ---------------- Check File ---------------- */

async function fileExists(path){

try{

await json(
"/repos/"+C.owner+"/"+C.repo+
"/contents/"+
encodeURIComponent(path)
.replace(/%2F/g,"/")
+
"?ref="+encodeURIComponent(C.branch)
);

return true;

}catch{

return false;

}

}


async function waitForFile(path,timeout){

const started=Date.now();

while(Date.now()-started<timeout){

if(await fileExists(path))
return true;

await new Promise(
resolve=>setTimeout(resolve,5000)
);

}

return false;

}


/* ---------------- Edit Gist Data ---------------- */

function openEdit(i){

const s=songs[i];

if(!s)return;

document.getElementById("editIndex").value=i;

document.getElementById("editTitle").value=
s.title||"";

document.getElementById("editUrl").value=
s.url||"";

document
.getElementById("editModal")
.classList
.remove("hidden","closing");

}


function closeEdit(){

const m=document.getElementById("editModal");

if(m.classList.contains("hidden"))
return;

m.classList.add("closing");

setTimeout(()=>{

m.classList.add("hidden");
m.classList.remove("closing");

},500);

}


async function saveEdit(){

const i=
Number(
document.getElementById("editIndex").value
);

if(!songs[i])return;

const title=
document.getElementById("editTitle")
.value
.trim();

const url=
document.getElementById("editUrl")
.value
.trim();


if(!title){

toast("عنوان را وارد کنید","err");
return;

}

if(!/^https?:\/\//i.test(url)){

toast("لینک نامعتبر است","err");
return;

}


busy(true,"در حال ویرایش اطلاعات آهنگ...");

try{

songs[i].title=title;
songs[i].url=url;


/*
Update format according to the edited URL.
*/

songs[i].format=
isMp3Url(url)
?"mp3"
:"source";


await saveGist();

render();

closeEdit();

toast(
"اطلاعات آهنگ در Gist ویرایش شد",
"ok"
);

}catch(e){

toast(e.message,"err");

}finally{

busy(false);

}

}


/* ---------------- Delete ---------------- */

async function del(i){

const yes=await customConfirm(

"این آهنگ از فهرست Gist حذف شود؟\n\n"+
"فایل موجود در مخزن حذف نخواهد شد.",

"حذف آهنگ"

);

if(!yes)return;


const old=songs[i];

songs.splice(i,1);

busy(true,"در حال حذف اطلاعات آهنگ...");

try{

await saveGist();

render();

toast(
"اطلاعات آهنگ حذف شد؛ فایل مخزن باقی ماند",
"ok"
);

}catch(e){

songs.splice(i,0,old);

render();

toast(e.message,"err");

}finally{

busy(false);

}

}


/* ---------------- Copy ---------------- */

function copy(i){

navigator.clipboard
.writeText(songs[i].url)
.then(()=>toast("لینک کپی شد","ok"))
.catch(e=>toast(e.message,"err"));

}


/* ---------------- Refresh ---------------- */

async function refreshSongs(){

try{

await loadSongs();

toast("فهرست تازه شد","ok");

}catch(e){

toast(e.message,"err");

}

}

"از HPanel Radio خارج شوید؟",

"خروج"

);

if(!yes)return;

localStorage.removeItem(AUTH);
localStorage.removeItem(TK);

location.href=
"https://herculepanel.github.io/";

}

"https://herculepanel.github.io/vault/";

admin=!!a.admin;

</script>
