<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">

<title>HPanel Radio</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<!-- FFmpeg.wasm -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.11.1/dist/ffmpeg.min.js"></script>

<style>
:root{
--bg:#0b0a09;
--text:#fff6ea;
--muted:#c3b09a;
--line:rgba(255,186,92,.22);
--gold:#ffb43a;
--mint:#3ee39a;
--ink:#140f0a
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Lalezar,Tahoma;
color:var(--text);
background:
radial-gradient(circle at 12% 0%,rgba(255,180,58,.23),transparent 32%),
radial-gradient(circle at 88% 30%,rgba(62,227,154,.11),transparent 30%),
linear-gradient(180deg,#120e0b,#070605)
}

.wrap{
width:min(1000px,calc(100% - 30px));
margin:auto;
padding:35px 0 25px
}

.head{
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
flex-wrap:wrap
}

.brand{
font-size:32px
}

.gold{
color:var(--gold)
}

.badge{
display:inline-block;
padding:5px 10px;
border-radius:999px;
background:rgba(62,227,154,.15);
color:var(--mint)
}

.panel{
margin-top:16px;
padding:15px;
border-radius:18px;
border:1px solid var(--line);
background:linear-gradient(
145deg,
rgba(255,255,255,.085),
rgba(255,180,58,.045),
rgba(255,255,255,.025)
);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.07),
0 18px 45px rgba(0,0,0,.18)
}

.btn{
border:0;
cursor:pointer;
border-radius:15px;
padding:9px 13px;
font:15px Lalezar;
margin:4px;
box-shadow:0 5px 0 rgba(0,0,0,.3)
}

.mint{
background:linear-gradient(180deg,#6af3b8,#17c77a);
color:#042016
}

.goldbtn{
background:linear-gradient(180deg,#ffd27a,#ff9d1f);
color:var(--ink)
}

.rose{
background:linear-gradient(180deg,#ff8a97,#e23b4d);
color:#fff
}

.home{
background:linear-gradient(180deg,#8ab0ff,#4d7dff);
color:#061018;
text-decoration:none
}

.ghost{
background:rgba(255,255,255,.06);
color:var(--text);
border:1px solid var(--line);
box-shadow:none
}

input{
width:100%;
padding:10px;
border-radius:13px;
border:1px solid var(--line);
background:rgba(255,255,255,.055);
backdrop-filter:blur(10px);
color:var(--text);
font:14px Lalezar
}

input[type=file]{
padding:8px;
cursor:pointer
}

input[type=file]::file-selector-button{
border:1px solid rgba(255,186,92,.35);
border-radius:10px;
padding:7px 11px;
margin-inline-end:9px;
background:linear-gradient(180deg,#ffd27a,#ff9d1f);
color:#140f0a;
font:14px Lalezar;
cursor:pointer;
transition:all .5s cubic-bezier(.22,1,.36,1)
}

input[type=file]::file-selector-button:hover{
transform:translateY(-2px);
box-shadow:0 7px 20px rgba(255,180,58,.22)
}

label{
display:block;
color:var(--gold);
margin:8px 0 5px
}

.song{
padding:12px;
margin:8px 0;
border-radius:16px;
background:rgba(255,255,255,.045);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
border:1px solid var(--line)
}

.song-title{
font-size:18px
}

.url{
direction:ltr;
text-align:left;
word-break:break-all;
color:var(--muted);
margin-top:4px
}

audio{
width:100%;
margin-top:10px;
border-radius:12px
}

.footer{
margin-top:22px;
padding:17px;
border-radius:18px;
border:1px solid var(--line);
background:linear-gradient(
145deg,
rgba(255,255,255,.06),
rgba(255,180,58,.035),
rgba(255,255,255,.02)
);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.06),
0 12px 35px rgba(0,0,0,.16);
text-align:center;
color:var(--muted)
}

.footer-title{
font-size:23px;
color:var(--text)
}

.footer-title .gold{
color:var(--gold)
}

.footer-version{
display:inline-block;
margin-top:4px;
padding:4px 10px;
border-radius:999px;
background:rgba(255,180,58,.10);
color:var(--gold);
font-size:13px
}

.footer-made{
margin-top:8px
}

.footer-bottom{
margin-top:3px;
font-family:Tahoma,sans-serif;
font-size:11px;
opacity:.7;
direction:ltr
}

.modal{
position:fixed;
inset:0;
background:rgba(8,6,4,.62);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
display:flex;
align-items:center;
justify-content:center;
z-index:10;
opacity:1;
animation:modalIn .55s cubic-bezier(.22,1,.36,1)
}

.modal.closing{
animation:modalOut .5s cubic-bezier(.55,0,.78,.18) forwards
}

.modal.hidden{
display:none
}

.modalbox{
width:min(550px,calc(100% - 30px));
padding:20px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(22,17,12,.72);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
box-shadow:
0 28px 80px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.08);
animation:boxIn .6s cubic-bezier(.22,1,.36,1)
}

.modal.closing .modalbox{
animation:boxOut .45s cubic-bezier(.55,0,.78,.18) forwards
}

@keyframes modalIn{
from{opacity:0}
to{opacity:1}
}

@keyframes modalOut{
from{opacity:1}
to{opacity:0}
}

@keyframes boxIn{
from{
opacity:0;
transform:translateY(18px) scale(.96)
}
to{
opacity:1;
transform:none
}
}

@keyframes boxOut{
to{
opacity:0;
transform:translateY(16px) scale(.96)
}
}

.hidden{
display:none!important
}

.loading{
text-align:center;
color:var(--muted)
}

.bar{
height:12px;
border-radius:999px;
background:#1b1711;
overflow:hidden;
margin-top:8px
}

.fill{
height:100%;
width:0;
background:linear-gradient(90deg,var(--gold),var(--mint));
transition:width .3s ease
}

.converter-status{
margin-top:9px;
font-size:13px;
color:var(--muted);
min-height:20px
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translate(-50%,22px) scale(.96);
padding:12px 18px;
border-radius:14px;
background:rgba(23,18,13,.68);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid var(--line);
box-shadow:
0 18px 45px rgba(0,0,0,.35),
inset 0 1px 0 rgba(255,255,255,.08);
opacity:0;
animation:toastIn .55s cubic-bezier(.22,1,.36,1) forwards;
z-index:200
}

.toast.hide{
animation:toastOut .55s cubic-bezier(.55,0,.78,.18) forwards
}

@keyframes toastIn{
to{
opacity:1;
transform:translate(-50%,0) scale(1)
}
}

@keyframes toastOut{
to{
opacity:0;
transform:translate(-50%,18px) scale(.94)
}
}

.ok{color:#9dffc9}
.err{color:#ffb0b7}

.spin{
display:inline-block;
width:16px;
height:16px;
border:2px solid rgba(0,0,0,.25);
border-top-color:#111;
border-radius:50%;
animation:s .7s linear infinite
}

@keyframes s{
to{transform:rotate(360deg)}
}

button,a,input{
transition:
transform .5s cubic-bezier(.22,1,.36,1),
opacity .5s ease,
border-color .5s ease,
box-shadow .5s ease,
background .5s ease
}

button:not(:disabled):hover,
a.btn:hover{
transform:translateY(-3px)
}

button:disabled{
opacity:.55;
cursor:not-allowed
}

.busy{
position:fixed;
inset:auto 50% 18px auto;
transform:translateX(50%);
display:flex;
align-items:center;
gap:8px;
padding:9px 14px;
border:1px solid var(--line);
border-radius:13px;
background:rgba(20,15,10,.92);
backdrop-filter:blur(10px);
z-index:50;
box-shadow:0 8px 30px #0008
}

.busy.hidden{
display:none
}

.bi{
display:inline-block;
vertical-align:-.12em;
margin-inline-end:6px
}

/* Custom Alert / Confirm */

.custom-dialog{
position:fixed;
inset:0;
background:rgba(8,6,4,.68);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
display:flex;
align-items:center;
justify-content:center;
z-index:150;
animation:dialogIn .35s cubic-bezier(.22,1,.36,1)
}

.custom-dialog.hidden{
display:none
}

.custom-dialog.closing{
animation:dialogOut .3s cubic-bezier(.55,0,.78,.18) forwards
}

.custom-dialog-box{
width:min(500px,calc(100% - 30px));
padding:21px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(22,17,12,.78);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
box-shadow:
0 28px 80px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.08);
animation:dialogBoxIn .4s cubic-bezier(.22,1,.36,1)
}

.custom-dialog.closing .custom-dialog-box{
animation:dialogBoxOut .3s cubic-bezier(.55,0,.78,.18) forwards
}

.dialog-title{
margin:0 0 8px;
font-size:23px
}

.dialog-message{
color:var(--muted);
line-height:1.9;
white-space:pre-wrap
}

.dialog-icon{
font-size:25px;
vertical-align:-.12em;
margin-inline-end:7px
}

.dialog-actions{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:17px
}

@keyframes dialogIn{
from{opacity:0}
to{opacity:1}
}

@keyframes dialogOut{
from{opacity:1}
to{opacity:0}
}

@keyframes dialogBoxIn{
from{
opacity:0;
transform:translateY(18px) scale(.96)
}
to{
opacity:1;
transform:none
}
}

@keyframes dialogBoxOut{
to{
opacity:0;
transform:translateY(16px) scale(.96)
}
}

@media(max-width:600px){

.wrap{
width:min(100% - 20px,1000px);
padding-top:20px
}

.brand{
font-size:27px
}

.head>div:last-child{
width:100%
}

.head>div:last-child .btn{
margin:3px 1px
}

.footer{
margin-bottom:10px
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="head">

<div>
<div class="brand">
<span class="gold">H</span>Panel <span class="gold">R</span>adio
</div>

</div>

<!-- Add Song Modal -->

<i class="bi bi-music-note-beamed"></i>

<input id="title" autocomplete="off">

id="file"
type="file"
accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac,.webm"
>

<div class="converter-status" id="converterStatus">
فقط MP3 مستقیماً آپلود می‌شود؛ فایل‌های صوتی دیگر قبل از آپلود به MP3 تبدیل می‌شوند.
</div>

<label>یا لینک MP3</label>
<input
id="url"
type="url"
placeholder="https://..."
>

<div id="progress" class="bar">

</div>

<button class="btn mint" onclick="saveSong()">

ذخیره

<!-- Custom Alert / Confirm -->

<div id="customDialog" class="custom-dialog hidden">

<div class="custom-dialog-box">

<div id="dialogMessage" class="dialog-message"></div>

<div id="dialogActions" class="dialog-actions"></div>

</div>

</div>


<script>

/* =========================================================
   HPanel Radio Configuration
========================================================= */

const C={
owner:"HerculePanel",
repo:"HPanelRadio",
branch:"main",
gist:"eb1b8cd10486738c06ed9cc12677b7e2",
file:"songs.json",
folder:"songs"
};

const AUTH="hpanel_auth";
const TK="hpanel_radio_token";
const ITEMS_KEY="hpanel_vault_items";

let token="";
let admin=false;
let songs=[];

let ffmpeg=null;
let ffmpegLoaded=false;


/* =========================================================
   Authentication
========================================================= */

function getAuth(){

try{
return JSON.parse(localStorage.getItem(AUTH)||"null");
}catch{
return null;
}

}


/*
 * Matches the Vault structure exactly.
 *
 * First use hpanel_radio_token.
 * If it isn't there, recover the Radio token from
 * hpanel_vault_items, exactly like Vault saves it.
 */

function recoverRadioToken(){

let t=localStorage.getItem(TK)||"";

if(t){
return t;
}

try{

const items=
JSON.parse(
localStorage.getItem(ITEMS_KEY)||"[]"
);

const x=items.find(x=>
x &&
x.token &&
String(x.name||"")
.toLowerCase()
.includes("radio")
);

if(x?.token){

localStorage.setItem(TK,x.token);

return x.token;

}

}catch{}

return "";

}


/* =========================================================
   Busy
========================================================= */

function busy(on,text="در حال انجام..."){

document.getElementById("busyText").textContent=text;

document
.getElementById("busy")
.classList
.toggle("hidden",!on);

}


/* =========================================================
   Toast
========================================================= */

function toast(t,c=""){

const x=document.createElement("div");

x.className="toast "+c;
x.textContent=t;

document.body.appendChild(x);

setTimeout(()=>{

x.classList.add("hide");

setTimeout(()=>{
x.remove();
},550);

},3000);

}


/* =========================================================
   Custom Dialogs
========================================================= */

function closeCustomDialog(){

const d=document.getElementById("customDialog");

if(d.classList.contains("hidden"))
return;

d.classList.add("closing");

setTimeout(()=>{

d.classList.add("hidden");
d.classList.remove("closing");

},300);

}


function customAlert(
message,
title="پیام",
type="info"
){

return new Promise(resolve=>{

const d=document.getElementById("customDialog");
const t=document.getElementById("dialogTitle");
const m=document.getElementById("dialogMessage");
const a=document.getElementById("dialogActions");

const icons={
info:"bi-info-circle",
success:"bi-check-circle",
error:"bi-exclamation-triangle",
warning:"bi-exclamation-triangle"
};

const buttonClass=
type==="error"||type==="warning"
?"rose"
:"mint";

t.innerHTML=
`<i class="bi ${icons[type]||icons.info} dialog-icon"></i>${esc(title)}`;

m.textContent=message;

a.innerHTML=`
<button class="btn ${buttonClass}" id="dialogOK">
<i class="bi bi-check-lg"></i>
باشه
</button>
`;

d.classList.remove("hidden","closing");

document.getElementById("dialogOK").onclick=()=>{

closeCustomDialog();

setTimeout(()=>{
resolve();
},300);

};

});

}


function customConfirm(
message,
title="تأیید"
){

return new Promise(resolve=>{

const d=document.getElementById("customDialog");
const t=document.getElementById("dialogTitle");
const m=document.getElementById("dialogMessage");
const a=document.getElementById("dialogActions");

t.innerHTML=
`<i class="bi bi-question-circle dialog-icon"></i>${esc(title)}`;

m.textContent=message;

a.innerHTML=`

<button class="btn mint" id="dialogYes">
<i class="bi bi-check-lg"></i>
بله
</button>

<button class="btn ghost" id="dialogNo">
<i class="bi bi-x-lg"></i>
خیر
</button>

`;

d.classList.remove("hidden","closing");


document.getElementById("dialogYes").onclick=()=>{

closeCustomDialog();

setTimeout(()=>{
resolve(true);
},300);

};


document.getElementById("dialogNo").onclick=()=>{

closeCustomDialog();

setTimeout(()=>{
resolve(false);
},300);

};

});

}


/* =========================================================
   GitHub API
========================================================= */

function api(path,opt={}){

return fetch(
"https://api.github.com"+path,
{
...opt,

headers:{
"Accept":"application/vnd.github+json",
"X-GitHub-Api-Version":"2022-11-28",
"Authorization":"Bearer "+token,
...(opt.headers||{})
}

}
);

}


async function json(path,opt={}){

const r=await api(path,opt);

const d=await r.json().catch(()=>null);

if(!r.ok)
throw Error(d?.message||"GitHub API "+r.status);

return d;

}


/* =========================================================
   Songs
========================================================= */

async function loadSongs(){

busy(true,"در حال بارگذاری آهنگ‌ها...");

try{

const d=await json("/gists/"+C.gist);

const f=d.files?.[C.file];

songs=f
?JSON.parse(
f.content||'{"songs":[]}'
).songs||[]
:[];

render();

}finally{

busy(false);

}

}


function render(){

const box=document.getElementById("songs");

if(!songs.length){

box.innerHTML=`
<p>
<i class="bi bi-music-note"></i>
هنوز آهنگی نیست.
</p>
`;

return;

}


box.innerHTML=songs.map((s,i)=>`

<div class="song">

<div class="song-title">
<b>
<i class="bi bi-music-note-beamed"></i>
${esc(s.title||"بدون عنوان")}
</b>
</div>

<div class="url">
${esc(s.url)}
</div>

<audio
controls
preload="none"
src="${esc(s.url)}"
></audio>

<div>

<button class="btn goldbtn" onclick="copy(${i})">
<i class="bi bi-clipboard"></i>
کپی لینک
</button>

<a
class="btn ghost"
href="${esc(s.url)}"
target="_blank"
rel="noopener"
>
<i class="bi bi-box-arrow-up-right"></i>
باز کردن
</a>

<button class="btn rose" onclick="del(${i})">
<i class="bi bi-trash3"></i>
حذف
</button>

</div>

</div>

`).join("");

}


/* =========================================================
   Escape HTML
========================================================= */

function esc(s){

return String(s??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================================
   Add Song Modal
========================================================= */

function openAdd(){

const m=document.getElementById("modal");

m.classList.remove("hidden","closing");

document.getElementById("fill").style.width="0%";

document.getElementById("converterStatus").textContent=
"فقط MP3 مستقیماً آپلود می‌شود؛ فایل‌های صوتی دیگر قبل از آپلود به MP3 تبدیل می‌شوند.";

}


function closeAdd(){

const m=document.getElementById("modal");

if(m.classList.contains("hidden"))
return;

m.classList.add("closing");

setTimeout(()=>{

m.classList.add("hidden");
m.classList.remove("closing");

},500);

}


/* =========================================================
   Public URL
========================================================= */

function publicUrl(n){

return `https://${C.owner}.github.io/${C.repo}/${C.folder}/${encodeURIComponent(n)}`;

}


/* =========================================================
   Base64
========================================================= */

function b64(file){

return new Promise((res,rej)=>{

const r=new FileReader;

r.onload=()=>{
res(
String(r.result).split(",")[1]
);
};

r.onerror=rej;

r.readAsDataURL(file);

});

}


/* =========================================================
   FFmpeg MP3 Converter
========================================================= */

async function loadFFmpeg(){

if(ffmpegLoaded)
return;

const status=
document.getElementById("converterStatus");

status.textContent=
"در حال آماده‌سازی مبدل MP3...";

if(typeof FFmpeg==="undefined" ||
!FFmpeg.createFFmpeg){

throw Error(
"مبدل MP3 بارگذاری نشد. اتصال اینترنت را بررسی کنید."
);

}

ffmpeg=FFmpeg.createFFmpeg({
log:false,

function cleanFileName(name){

return String(name||"audio")
.replace(/\.[^/.]+$/,"")
.replace(/[\\/:*?"<>|]/g,"_")
.trim()||"audio";

}


async function convertToMP3(file){

const status=
document.getElementById("converterStatus");

status.textContent=
"در حال تبدیل فایل به MP3...";

document.getElementById("fill").style.width="10%";

await loadFFmpeg();

const inputName=
"input_"+Date.now()+"."+(
file.name.split(".").pop()||"audio"
);

const outputName=
cleanFileName(file.name)+"_"+Date.now()+".mp3";

ffmpeg.FS(
"writeFile",
inputName,
await fetchFile(file)
);

document.getElementById("fill").style.width="30%";

await ffmpeg.run(
"-i",
inputName,
"-vn",
"-codec:a",
"libmp3lame",
"-b:a",
"192k",
outputName
);

document.getElementById("fill").style.width="65%";

const data=
ffmpeg.FS(
"readFile",
outputName
);

try{
ffmpeg.FS("unlink",inputName);
}catch{}

try{
ffmpeg.FS("unlink",outputName);
}catch{}

status.textContent=
"تبدیل به MP3 با موفقیت انجام شد.";

return new File(
[data.buffer],
outputName,
{
type:"audio/mpeg",
lastModified:Date.now()
}
);

}


/*
 * fetchFile helper required by FFmpeg.wasm 0.11
 */

async function fetchFile(file){

if(file instanceof Uint8Array)
return file;

if(file instanceof ArrayBuffer)
return new Uint8Array(file);

const buffer=
await file.arrayBuffer();

return new Uint8Array(buffer);

}


/* =========================================================
   Save Song
========================================================= */

async function saveSong(){

const title=
document.getElementById("title")
.value
.trim();

let file=
document.getElementById("file")
.files[0];

let url=
document.getElementById("url")
.value
.trim();


if(!title){

toast("عنوان را بنویس","err");
return;

}


if(!file&&!url){

toast("فایل یا لینک را وارد کن","err");
return;

}


busy(true,"در حال ذخیره آهنگ...");

try{

/* -----------------------------------------
   File upload
----------------------------------------- */

if(file){

if(file.size>30*1024*1024){

throw Error(
"حجم فایل باید کمتر از ۳۰ مگابایت باشد"
);

}


/*
 * If the selected file isn't MP3,
 * automatically convert it.
 */

const isMP3=
file.type==="audio/mpeg" ||
/\.mp3$/i.test(file.name);

if(!isMP3){

file=await convertToMP3(file);

}else{

document.getElementById("converterStatus")
.textContent=
"فایل MP3 است و نیازی به تبدیل ندارد.";

}


const content=
await b64(file);

const safeName=
cleanFileName(file.name)+".mp3";

const path=
C.folder+"/"+safeName;

document.getElementById("fill").style.width="72%";


await json(
"/repos/"+C.owner+"/"+C.repo+
"/contents/"+
encodeURIComponent(path)
.replace(/%2F/g,"/"),
{
method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:
"Add song "+safeName,

content,

branch:C.branch

})

}
);


url=publicUrl(safeName);

document.getElementById("fill").style.width="88%";

}


/* -----------------------------------------
   URL validation
----------------------------------------- */

if(!/^https?:\/\//i.test(url)){

throw Error("لینک نامعتبر است");

}


/* -----------------------------------------
   Save Gist metadata
----------------------------------------- */

songs.push({

title,

url,

size:file?.size||0,

added:new Date().toISOString()

});


await json(
"/gists/"+C.gist,
{
method:"PATCH",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

files:{

[C.file]:{

content:
JSON.stringify(
{songs},
null,
2
)

}

}

})

}
);


document.getElementById("fill").style.width="100%";

render();

closeAdd();

toast("آهنگ ذخیره شد","ok");


}catch(e){

console.error(e);

toast(
e?.message||"خطایی رخ داد",
"err"
);

}finally{

busy(false);

}

}


/* =========================================================
   Delete
========================================================= */

async function del(i){

const yes=
await customConfirm(
"این آهنگ حذف شود؟",
"حذف آهنگ"
);

if(!yes)
return;


const oldSongs=[...songs];

songs.splice(i,1);

busy(true,"در حال حذف آهنگ...");


try{

await json(
"/gists/"+C.gist,
{
method:"PATCH",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

files:{

[C.file]:{

content:
JSON.stringify(
{songs},
null,
2
)

}

}

})

}
);


render();

toast("حذف شد","ok");


}catch(e){

songs=oldSongs;

render();

toast(e.message,"err");

}finally{

busy(false);

}

}

/* =========================================================

========================================================= */

(async()=>{

const a=getAuth();


/*
 * EXACT Vault authentication format:
 *
 * {
 *   loggedIn:true,
 *   admin:true/false,
 *   at:Date.now()
 * }
 */

if(!a?.loggedIn){

location.href=
"https://herculepanel.github.io/vault/";

return;

}


admin=!!a.admin;


/*
 * Recover token from hpanel_radio_token
 * or hpanel_vault_items.
 */

token=recoverRadioToken();


/*
 * IMPORTANT:
 * Don't redirect when the token is missing.
 * This prevents the Radio ↔ Vault redirect loop.
 */

if(!token){

showTokenError();

return;

}


document.getElementById("role").textContent=
admin?"مدیر":"کاربر";

await json(
`/repos/${C.owner}/${C.repo}`
);
