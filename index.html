<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HerculePanel Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a09;--text:#fff6ea;--muted:#c3b09a;--line:rgba(255,186,92,.22);--gold:#ffb43a;--mint:#3ee39a;--ink:#140f0a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Lalezar,Tahoma;color:var(--text);background:radial-gradient(circle at 12% 0%,rgba(255,180,58,.23),transparent 32%),radial-gradient(circle at 88% 30%,rgba(62,227,154,.11),transparent 30%),linear-gradient(180deg,#120e0b,#070605)}.wrap{width:min(1000px,calc(100% - 30px));margin:auto;padding:35px 0 70px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:32px}.gold{color:var(--gold)}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(62,227,154,.15);color:var(--mint)}.panel{margin-top:16px;padding:15px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,180,58,.045),rgba(255,255,255,.025));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 45px rgba(0,0,0,.18)}.btn{border:0;cursor:pointer;border-radius:15px;padding:9px 13px;font:15px Lalezar;margin:4px;box-shadow:0 5px 0 rgba(0,0,0,.3)}.mint{background:linear-gradient(180deg,#6af3b8,#17c77a);color:#042016}.goldbtn{background:linear-gradient(180deg,#ffd27a,#ff9d1f);color:var(--ink)}.rose{background:linear-gradient(180deg,#ff8a97,#e23b4d);color:#fff}.home{background:linear-gradient(180deg,#8ab0ff,#4d7dff);color:#061018;text-decoration:none}.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);box-shadow:none}input{width:100%;padding:10px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.055);backdrop-filter:blur(10px);color:var(--text);font:14px Lalezar}input[type=file]{padding:8px;cursor:pointer}input[type=file]::file-selector-button{border:1px solid rgba(255,186,92,.35);border-radius:10px;padding:7px 11px;margin-inline-end:9px;background:linear-gradient(180deg,#ffd27a,#ff9d1f);color:#140f0a;font:14px Lalezar;cursor:pointer;transition:all .5s cubic-bezier(.22,1,.36,1)}input[type=file]::file-selector-button:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(255,180,58,.22)}label{display:block;color:var(--gold);margin:8px 0 5px}.song{padding:12px;margin:8px 0;border-radius:16px;background:rgba(255,255,255,.045);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}.url{direction:ltr;text-align:left;word-break:break-all;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(8,6,4,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;z-index:10;opacity:1;animation:modalIn .55s cubic-bezier(.22,1,.36,1)}.modal.closing{animation:modalOut .5s cubic-bezier(.55,0,.78,.18) forwards}.modal.hidden{display:none}.modalbox{animation:boxIn .6s cubic-bezier(.22,1,.36,1)}.modal.closing .modalbox{animation:boxOut .45s cubic-bezier(.55,0,.78,.18) forwards}@keyframes modalIn{from{opacity:0}to{opacity:1}}@keyframes modalOut{from{opacity:1}to{opacity:0}}@keyframes boxIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}@keyframes boxOut{to{opacity:0;transform:translateY(16px) scale(.96)}}.modalbox{width:min(550px,calc(100% - 30px));padding:20px;border-radius:20px;border:1px solid var(--line);background:rgba(22,17,12,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 28px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}.hidden{display:none!important}.loading{text-align:center;color:var(--muted)}.bar{height:12px;border-radius:999px;background:#1b1711;overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--mint))}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,22px) scale(.96);padding:12px 18px;border-radius:14px;background:rgba(23,18,13,.68);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 18px 45px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);opacity:0;animation:toastIn .55s cubic-bezier(.22,1,.36,1) forwards}.toast.hide{animation:toastOut .55s cubic-bezier(.55,0,.78,.18) forwards}@keyframes toastIn{to{opacity:1;transform:translate(-50%,0) scale(1)}}@keyframes toastOut{to{opacity:0;transform:translate(-50%,18px) scale(.94)}}.ok{color:#9dffc9}.err{color:#ffb0b7}.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
button,a,input{transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .5s ease,border-color .5s ease,box-shadow .5s ease,background .5s ease}button:not(:disabled):hover,a.btn:hover{transform:translateY(-3px)}button:disabled{opacity:.55}.busy{position:fixed;inset:auto 50% 18px auto;transform:translateX(50%);display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(20,15,10,.92);backdrop-filter:blur(10px);z-index:50;box-shadow:0 8px 30px #0008}.busy.hidden{display:none}</style>
</head>
<body>
<div class="wrap">
<div class="head"><div><div class="brand"><span class="gold">H</span>ercule<span class="gold">P</span>anel <span class="gold">R</span>adio</div><span id="role" class="badge"></span></div><div><button class="btn rose" onclick="logout()">خروج</button><a class="btn home" href="https://herculepanel.github.io/">منوی اصلی</a><button class="btn ghost" onclick="refreshSongs()">تازه‌سازی</button></div></div>
<div id="loading" class="panel loading">checking login data... <span class="spin"></span></div><div id="busy" class="busy hidden"><span class="spin"></span><span id="busyText">در حال انجام...</span></div>
<div id="app" style="display:none">
<div class="panel"><button class="btn mint" onclick="openAdd()">افزودن آهنگ</button><div id="songs"></div></div>
</div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><h2>افزودن آهنگ</h2><label>عنوان</label><input id="title"><label>فایل MP3</label><input id="file" type="file" accept=".mp3,audio/mpeg"><label>یا لینک MP3</label><input id="url" type="url" placeholder="https://..."><div id="progress" class="bar"><div id="fill" class="fill"></div></div><button class="btn mint" onclick="saveSong()">ذخیره</button><button class="btn ghost" onclick="closeAdd()">لغو</button></div></div>
<script>
const C={owner:"HerculePanel",repo:"HPanelRadio",branch:"main",gist:"eb1b8cd10486738c06ed9cc12677b7e2",file:"songs.json",folder:"songs"};
const AUTH="hpanel_auth",TK="hpanel_radio_token";let token="",admin=false,songs=[];
function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH)||"null")}catch{return null}}
function busy(on,text="در حال انجام..."){document.getElementById("busyText").textContent=text;document.getElementById("busy").classList.toggle("hidden",!on)}
function toast(t,c=""){const x=document.createElement("div");x.className="toast "+c;x.textContent=t;document.body.appendChild(x);setTimeout(()=>{x.classList.add("hide");setTimeout(()=>x.remove(),550)},3000)}
function api(path,opt={}){return fetch("https://api.github.com"+path,{...opt,headers:{"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Authorization":"Bearer "+token,...(opt.headers||{})}})}
async function json(path,opt={}){const r=await api(path,opt),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||"GitHub API "+r.status);return d}
async function loadSongs(){busy(true,"در حال بارگذاری آهنگ‌ها...");try{const d=await json("/gists/"+C.gist);const f=d.files?.[C.file];songs=f?JSON.parse(f.content||'{"songs":[]}').songs||[]:[];render()}finally{busy(false)}}
function render(){const box=document.getElementById("songs");if(!songs.length){box.innerHTML="<p>هنوز آهنگی نیست.</p>";return}box.innerHTML=songs.map((s,i)=>`<div class="song"><b>${esc(s.title||"بدون عنوان")}</b><div class="url">${esc(s.url)}</div><button class="btn goldbtn" onclick="copy(${i})">کپی لینک</button><a class="btn ghost" href="${esc(s.url)}" target="_blank">باز کردن</a><button class="btn rose" onclick="del(${i})">حذف</button></div>`).join("")}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function openAdd(){const m=document.getElementById("modal");m.classList.remove("hidden","closing");requestAnimationFrame(()=>m.classList.add("show"))}
function closeAdd(){const m=document.getElementById("modal");if(m.classList.contains("hidden"))return;m.classList.add("closing");setTimeout(()=>m.classList.add("hidden"),500)}
function publicUrl(n){return `https://${C.owner}.github.io/${C.repo}/${C.folder}/${encodeURIComponent(n)}`}
function b64(file){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file)})}
async function saveSong(){const title=document.getElementById("title").value.trim(),file=document.getElementById("file").files[0];let url=document.getElementById("url").value.trim();if(!title)return toast("عنوان را بنویس","err");if(!file&&!url)return toast("فایل یا لینک را وارد کن","err");busy(true,"در حال ذخیره آهنگ...");try{if(file){if(file.size>20*1024*1024)throw Error("حجم فایل باید کمتر از ۲۰ مگابایت باشد");const content=await b64(file),path=C.folder+"/"+file.name;document.getElementById("fill").style.width="50%";await json("/repos/"+C.owner+"/"+C.repo+"/contents/"+encodeURIComponent(path).replace(/%2F/g,"/"),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"Add song "+file.name,content,branch:C.branch})});url=publicUrl(file.name);document.getElementById("fill").style.width="100%"}if(!/^https?:\/\//i.test(url))throw Error("لینک نامعتبر است");songs.push({title,url,size:file?.size||0,added:new Date().toISOString()});await json("/gists/"+C.gist,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({files:{[C.file]:{content:JSON.stringify({songs},null,2)}}})});render();closeAdd();toast("آهنگ ذخیره شد","ok")}catch(e){toast(e.message,"err")}finally{busy(false)}}
async function del(i){if(!confirm("این آهنگ حذف شود؟"))return;songs.splice(i,1);busy(true,"در حال حذف آهنگ...");try{await json("/gists/"+C.gist,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({files:{[C.file]:{content:JSON.stringify({songs},null,2)}}})});render();toast("حذف شد","ok")}catch(e){toast(e.message,"err")}finally{busy(false)}}
function copy(i){navigator.clipboard.writeText(songs[i].url).then(()=>toast("لینک کپی شد","ok")).catch(e=>toast(e.message,"err"))}
async function refreshSongs(){try{await loadSongs();toast("فهرست تازه شد","ok")}catch(e){toast(e.message,"err")}}
function logout(){localStorage.removeItem(AUTH);localStorage.removeItem(TK);location.href="https://herculepanel.github.io/"}
(async()=>{const a=getAuth();if(!a?.loggedIn){location.href="https://herculepanel.github.io/vault/";return}admin=!!a.admin;token=localStorage.getItem(TK)||"";if(!token){location.href="https://herculepanel.github.io/vault/";return}document.getElementById("role").textContent=admin?"مدیر":"کاربر";try{await json(`/repos/${C.owner}/${C.repo}`);await loadSongs();document.getElementById("loading").style.display="none";document.getElementById("app").style.display="block"}catch(e){toast("checking login data... ناموفق: "+e.message,"err")}})();
</script>
</body></html>
