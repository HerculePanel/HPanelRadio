<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPanel Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a09;--text:#fff6ea;--muted:#c3b09a;--line:rgba(255,186,92,.22);--gold:#ffb43a;--mint:#3ee39a;--ink:#140f0a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Lalezar,Tahoma;color:var(--text);background:radial-gradient(circle at 12% 0%,rgba(255,180,58,.18),transparent 32%),linear-gradient(180deg,#120e0b,#070605)}.wrap{width:min(1000px,calc(100% - 30px));margin:auto;padding:35px 0 70px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:40px}.gold{color:var(--gold)}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(62,227,154,.15);color:var(--mint)}.panel{margin-top:16px;padding:20px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.035)}.btn{border:0;cursor:pointer;border-radius:15px;padding:11px 15px;font:17px Lalezar;margin:4px;box-shadow:0 5px 0 rgba(0,0,0,.3)}.mint{background:linear-gradient(180deg,#6af3b8,#17c77a);color:#042016}.goldbtn{background:linear-gradient(180deg,#ffd27a,#ff9d1f);color:var(--ink)}.rose{background:linear-gradient(180deg,#ff8a97,#e23b4d);color:#fff}.home{background:linear-gradient(180deg,#8ab0ff,#4d7dff);color:#061018;text-decoration:none}.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);box-shadow:none}input{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font:16px Lalezar}label{display:block;color:var(--gold);margin:8px 0 5px}.song{padding:15px;margin:10px 0;border-radius:16px;background:rgba(0,0,0,.24);border:1px solid var(--line)}.url{direction:ltr;text-align:left;word-break:break-all;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(8,6,4,.8);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;z-index:10}.modal.hidden{display:none}.modalbox{width:min(550px,calc(100% - 30px));padding:25px;border-radius:25px;border:1px solid var(--line);background:#16110c}.hidden{display:none!important}.loading{text-align:center;color:var(--muted)}.bar{height:12px;border-radius:999px;background:#1b1711;overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--mint))}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:#17120d;border:1px solid var(--line)}.ok{color:#9dffc9}.err{color:#ffb0b7}.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><div><div class="brand"><span class="gold">HP</span>anel Radio</div><span id="role" class="badge"></span></div><div><button class="btn rose" onclick="logout()">خروج</button><a class="btn home" href="https://herculepanel.github.io/">منوی اصلی</a><button class="btn ghost" onclick="refreshSongs()">تازه‌سازی</button></div></div>
<div id="loading" class="panel loading">checking login data... <span class="spin"></span></div>
<div id="app" style="display:none">
<div class="panel"><button class="btn mint" onclick="openAdd()">افزودن آهنگ</button><div id="songs"></div></div>
</div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><h2>افزودن آهنگ</h2><label>عنوان</label><input id="title"><label>فایل MP3</label><input id="file" type="file" accept=".mp3,audio/mpeg"><label>یا لینک MP3</label><input id="url" type="url" placeholder="https://..."><div id="progress" class="bar"><div id="fill" class="fill"></div></div><button class="btn mint" onclick="saveSong()">ذخیره</button><button class="btn ghost" onclick="closeAdd()">لغو</button></div></div>
<script>
const C={owner:"HerculePanel",repo:"HPanelRadio",branch:"main",gist:"eb1b8cd10486738c06ed9cc12677b7e2",file:"songs.json",folder:"songs"};
const AUTH="hpanel_auth",TK="hpanel_radio_token";let token="",admin=false,songs=[];
function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH)||"null")}catch{return null}}
function toast(t,c=""){const x=document.createElement("div");x.className="toast "+c;x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),3000)}
function api(path,opt={}){return fetch("https://api.github.com"+path,{...opt,headers:{"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Authorization":"Bearer "+token,...(opt.headers||{})}})}
async function json(path,opt={}){const r=await api(path,opt),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||"GitHub API "+r.status);return d}
async function loadSongs(){const d=await json("/gists/"+C.gist);const f=d.files?.[C.file];songs=f?JSON.parse(f.content||'{"songs":[]}').songs||[]:[];render()}
function render(){const box=document.getElementById("songs");if(!songs.length){box.innerHTML="<p>هنوز آهنگی نیست.</p>";return}box.innerHTML=songs.map((s,i)=>`<div class="song"><b>${esc(s.title||"بدون عنوان")}</b><div class="url">${esc(s.url)}</div><button class="btn goldbtn" onclick="copy(${i})">کپی لینک</button><a class="btn ghost" href="${esc(s.url)}" target="_blank">باز کردن</a><button class="btn rose" onclick="del(${i})">حذف</button></div>`).join("")}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function openAdd(){document.getElementById("modal").classList.remove("hidden")}
function closeAdd(){document.getElementById("modal").classList.add("hidden")}
function publicUrl(n){return `https://${C.owner}.github.io/${C.repo}/${C.folder}/${encodeURIComponent(n)}`}
function b64(file){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file)})}
async function saveSong(){const title=document.getElementById("title").value.trim(),file=document.getElementById("file").files[0];let url=document.getElementById("url").value.trim();if(!title)return toast("عنوان را بنویس","err");if(!file&&!url)return toast("فایل یا لینک را وارد کن","err");try{if(file){if(file.size>20*1024*1024)throw Error("حجم فایل باید کمتر از ۲۰ مگابایت باشد");const content=await b64(file),path=C.folder+"/"+file.name;document.getElementById("fill").style.width="50%";await json("/repos/"+C.owner+"/"+C.repo+"/contents/"+encodeURIComponent(path).replace(/%2F/g,"/"),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"Add song "+file.name,content,branch:C.branch})});url=publicUrl(file.name);document.getElementById("fill").style.width="100%"}if(!/^https?:\/\//i.test(url))throw Error("لینک نامعتبر است");songs.push({title,url,size:file?.size||0,added:new Date().toISOString()});await json("/gists/"+C.gist,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({files:{[C.file]:{content:JSON.stringify({songs},null,2)}}})});render();closeAdd();toast("آهنگ ذخیره شد","ok")}catch(e){toast(e.message,"err")}}
async function del(i){if(!confirm("این آهنگ حذف شود؟"))return;songs.splice(i,1);try{await json("/gists/"+C.gist,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({files:{[C.file]:{content:JSON.stringify({songs},null,2)}}})});render();toast("حذف شد","ok")}catch(e){toast(e.message,"err")}}
function copy(i){navigator.clipboard.writeText(songs[i].url).then(()=>toast("لینک کپی شد","ok"))}
async function refreshSongs(){try{await loadSongs()}catch(e){toast(e.message,"err")}}
function logout(){localStorage.removeItem(AUTH);localStorage.removeItem(TK);location.href="https://herculepanel.github.io/"}
(async()=>{const a=getAuth();if(!a?.loggedIn){location.href="https://herculepanel.github.io/vault/";return}admin=!!a.admin;token=localStorage.getItem(TK)||"";if(!token){location.href="https://herculepanel.github.io/vault/";return}document.getElementById("role").textContent=admin?"مدیر":"کاربر";try{await json(`/repos/${C.owner}/${C.repo}`);await loadSongs();document.getElementById("loading").style.display="none";document.getElementById("app").style.display="block"}catch(e){toast("checking login data... ناموفق: "+e.message,"err")}})();
</script>
</body></html>
