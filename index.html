<style>
:root{
--bg:#0b0a09;
--text:#fff6ea;
--muted:#c3b09a;
--line:rgba(255,186,92,.22);
--gold:#ffb43a;
--mint:#3ee39a;
--ink:#140f0a
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Lalezar,Tahoma;
color:var(--text);
background:
radial-gradient(circle at 12% 0%,rgba(255,180,58,.23),transparent 32%),
radial-gradient(circle at 88% 30%,rgba(62,227,154,.11),transparent 30%),
linear-gradient(180deg,#120e0b,#070605)
}

.wrap{
width:min(1000px,calc(100% - 30px));
margin:auto;
padding:35px 0 25px
}

.head{
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
flex-wrap:wrap
}

.brand{
font-size:32px
}

.gold{
color:var(--gold)
}

.badge{
display:inline-block;
padding:5px 10px;
border-radius:999px;
background:rgba(62,227,154,.15);
color:var(--mint)
}

.panel{
margin-top:16px;
padding:15px;
border-radius:18px;
border:1px solid var(--line);
background:linear-gradient(
145deg,
rgba(255,255,255,.085),
rgba(255,180,58,.045),
rgba(255,255,255,.025)
);

-webkit-backdrop-filter:blur(18px);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.07),
0 18px 45px rgba(0,0,0,.18)
}

.btn{

cursor:pointer;
border-radius:15px;
padding:9px 13px;
font:15px Lalezar;
margin:4px;
box-shadow:0 5px 0 rgba(0,0,0,.3)
}

.mint{
background:linear-gradient(180deg,#6af3b8,#17c77a);
color:#042016
}

.goldbtn{
background:linear-gradient(180deg,#ffd27a,#ff9d1f);

}

.rose{
background:linear-gradient(180deg,#ff8a97,#e23b4d);

.home{

color:#061018;

.ghost{

color:var(--text);

input{

padding:10px;

input[type=file]{
padding:8px;

input[type=file]::file-selector-button{

margin-inline-end:9px;

label{

.song{
padding:12px;

}

.song-title{
font-size:18px

.url{

audio{

.footer{
margin-top:22px;
padding:17px;

border:1px solid var(--line);

145deg,
rgba(255,255,255,.06),
rgba(255,180,58,.035),
rgba(255,255,255,.02)
);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.06),
0 12px 35px rgba(0,0,0,.16);
text-align:center;
color:var(--muted)
}

.footer-title{
font-size:23px;
color:var(--text)
}

.footer-title .gold{
color:var(--gold)
}

.footer-version{
display:inline-block;
margin-top:4px;
padding:4px 10px;
border-radius:999px;
background:rgba(255,180,58,.10);
color:var(--gold);
font-size:13px
}

.footer-made{
margin-top:8px
}

.footer-bottom{
margin-top:3px;
font-family:Tahoma,sans-serif;
font-size:11px;
opacity:.7;
direction:ltr
}

.modal{
position:fixed;
inset:0;
background:rgba(8,6,4,.62);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
display:flex;
align-items:center;
justify-content:center;
z-index:100;
animation:modalIn .55s cubic-bezier(.22,1,.36,1)
}

.modal.closing{
animation:modalOut .5s cubic-bezier(.55,0,.78,.18) forwards
}

.modal.hidden{
display:none
}

.modalbox{
width:min(550px,calc(100% - 30px));
padding:20px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(22,17,12,.72);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
box-shadow:
0 28px 80px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.08);
animation:boxIn .6s cubic-bezier(.22,1,.36,1)
}

.modal.closing .modalbox{
animation:boxOut .45s cubic-bezier(.55,0,.78,.18) forwards
}

@keyframes modalIn{
from{opacity:0}
to{opacity:1}
}

@keyframes modalOut{
from{opacity:1}
to{opacity:0}
}

@keyframes boxIn{
from{
opacity:0;
transform:translateY(18px) scale(.96)
}
to{
opacity:1;
transform:none
}
}

@keyframes boxOut{
to{
opacity:0;
transform:translateY(16px) scale(.96)
}
}

.hidden{
display:none!important
}

.loading{
text-align:center;
color:var(--muted)
}

.bar{
height:12px;
border-radius:999px;
background:#1b1711;
overflow:hidden;
margin-top:8px
}

.fill{
height:100%;
width:0;
background:linear-gradient(90deg,var(--gold),var(--mint));
transition:width .3s ease
}

.status{
margin-top:8px;
min-height:24px;
color:var(--muted);
line-height:1.7
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translate(-50%,22px) scale(.96);
padding:12px 18px;
border-radius:14px;
background:rgba(23,18,13,.68);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid var(--line);
box-shadow:
0 18px 45px rgba(0,0,0,.35),
inset 0 1px 0 rgba(255,255,255,.08);
opacity:0;
animation:toastIn .55s cubic-bezier(.22,1,.36,1) forwards;
z-index:300
}

.toast.hide{
animation:toastOut .55s cubic-bezier(.55,0,.78,.18) forwards
}

@keyframes toastIn{
to{
opacity:1;
transform:translate(-50%,0) scale(1)
}
}

@keyframes toastOut{
to{
opacity:0;
transform:translate(-50%,18px) scale(.94)
}
}

.ok{color:#9dffc9}
.err{color:#ffb0b7}

.spin{
display:inline-block;
width:16px;
height:16px;
border:2px solid rgba(0,0,0,.25);
border-top-color:#111;
border-radius:50%;
animation:s .7s linear infinite
}

@keyframes s{
to{transform:rotate(360deg)}
}

button,a,input{
transition:
transform .5s cubic-bezier(.22,1,.36,1),
opacity .5s ease,
border-color .5s ease,
box-shadow .5s ease,
background .5s ease
}

button:not(:disabled):hover,
a.btn:hover{
transform:translateY(-3px)
}

button:disabled{
opacity:.55;
cursor:not-allowed
}

.busy{
position:fixed;
inset:auto 50% 18px auto;
transform:translateX(50%);
display:flex;
align-items:center;
gap:8px;
padding:9px 14px;
border:1px solid var(--line);
border-radius:13px;
background:rgba(20,15,10,.92);
backdrop-filter:blur(10px);
z-index:250;
box-shadow:0 8px 30px #0008
}

.busy.hidden{
display:none
}

.bi{
display:inline-block;
vertical-align:-.12em;
margin-inline-end:6px
}

/* Custom Alert / Confirm */

.custom-dialog{
position:fixed;
inset:0;
background:rgba(8,6,4,.68);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
display:flex;
align-items:center;
justify-content:center;
z-index:500;
animation:dialogIn .35s cubic-bezier(.22,1,.36,1)
}

.custom-dialog.hidden{
display:none
}

.custom-dialog.closing{
animation:dialogOut .3s cubic-bezier(.55,0,.78,.18) forwards
}

.custom-dialog-box{
width:min(500px,calc(100% - 30px));
padding:21px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(22,17,12,.78);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
box-shadow:
0 28px 80px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.08);
animation:dialogBoxIn .4s cubic-bezier(.22,1,.36,1)

.custom-dialog.closing .custom-dialog-box{
animation:dialogBoxOut .3s cubic-bezier(.55,0,.78,.18) forwards

.dialog-title{
margin:0 0 8px;

}

.dialog-message{

.dialog-icon{

.dialog-actions{

@keyframes dialogIn{
from{opacity:0}
to{opacity:1}
}

@keyframes dialogOut{
from{opacity:1}
to{opacity:0}
}

@keyframes dialogBoxIn{
from{
opacity:0;
transform:translateY(18px) scale(.96)
}
to{
opacity:1;
transform:none
}
}

@keyframes dialogBoxOut{
to{
opacity:0;
transform:translateY(16px) scale(.96)
}

@media(max-width:600px){

.wrap{

<script>

const C={
owner:"HerculePanel",
repo:"HPanelRadio",
branch:"main",
gist:"eb1b8cd10486738c06ed9cc12677b7e2",
file:"songs.json",
folder:"songs",
workflow:"convert.yml"
};

const AUTH="hpanel_auth";
const TK="hpanel_radio_token";
const ITEMS_KEY="hpanel_vault_items";

let token="";
let admin=false;
let songs=[];


/* =========================================================
   Auth
========================================================= */

function getAuth(){

try{
return JSON.parse(
localStorage.getItem(AUTH)||"null"
);
}catch{
return null;
}

}


function recoverRadioToken(){

let t=
localStorage.getItem(TK)||"";

if(t)
return t;

try{

const items=
JSON.parse(
localStorage.getItem(ITEMS_KEY)||"[]"
);

const x=items.find(x=>
x &&
x.token &&
String(x.name||"")
.toLowerCase()
.includes("radio")
);

if(x?.token){

localStorage.setItem(
TK,
x.token
);

return x.token;

}

}catch{}

return "";

}


/* =========================================================
   UI helpers
========================================================= */

function busy(on,text="در حال انجام..."){

document
.getElementById("busyText")
.textContent=text;

document
.getElementById("busy")
.classList
.toggle("hidden",!on);

}


function toast(t,c=""){

const x=document.createElement("div");

x.className="toast "+c;
x.textContent=t;

document.body.appendChild(x);

setTimeout(()=>{

x.classList.add("hide");

setTimeout(()=>{
x.remove();
},550);

},3000);

}


/* =========================================================
   Dialog
========================================================= */

function closeCustomDialog(){

const d=
document.getElementById("customDialog");

if(d.classList.contains("hidden"))
return;

d.classList.add("closing");

setTimeout(()=>{

d.classList.add("hidden");
d.classList.remove("closing");

},300);

}


function customAlert(
message,
title="پیام",
type="info"
){

return new Promise(resolve=>{

const d=document.getElementById("customDialog");
const t=document.getElementById("dialogTitle");
const m=document.getElementById("dialogMessage");
const a=document.getElementById("dialogActions");

const icons={
info:"bi-info-circle",
success:"bi-check-circle",
error:"bi-exclamation-triangle",
warning:"bi-exclamation-triangle"
};

const cls=
type==="error"||type==="warning"
?"rose"
:"mint";

t.innerHTML=
`<i class="bi ${icons[type]||icons.info} dialog-icon"></i>${esc(title)}`;

m.textContent=message;

a.innerHTML=`
<button class="btn ${cls}" id="dialogOK">
<i class="bi bi-check-lg"></i>
باشه
</button>
`;

d.classList.remove("hidden","closing");

document.getElementById("dialogOK").onclick=()=>{

closeCustomDialog();

setTimeout(resolve,300);

};

});

}


function customConfirm(
message,
title="تأیید"
){

return new Promise(resolve=>{

const d=document.getElementById("customDialog");
const t=document.getElementById("dialogTitle");
const m=document.getElementById("dialogMessage");
const a=document.getElementById("dialogActions");

t.innerHTML=
`<i class="bi bi-question-circle dialog-icon"></i>${esc(title)}`;

m.textContent=message;

a.innerHTML=`

<button class="btn mint" id="dialogYes">
<i class="bi bi-check-lg"></i>
بله
</button>

<button class="btn ghost" id="dialogNo">
<i class="bi bi-x-lg"></i>
خیر
</button>

`;

d.classList.remove("hidden","closing");

document.getElementById("dialogYes").onclick=()=>{

closeCustomDialog();

setTimeout(()=>resolve(true),300);

};

document.getElementById("dialogNo").onclick=()=>{

closeCustomDialog();

setTimeout(()=>resolve(false),300);

};

});

}


/* =========================================================
   GitHub API
========================================================= */

function api(path,opt={}){

return fetch(
"https://api.github.com"+path,
{
...opt,

headers:{
"Accept":"application/vnd.github+json",
"X-GitHub-Api-Version":"2022-11-28",
"Authorization":"Bearer "+token,
...(opt.headers||{})
}

}
);

}


async function json(path,opt={}){

const r=await api(path,opt);

const d=
await r.json().catch(()=>null);

if(!r.ok)
throw Error(
d?.message||"GitHub API "+r.status
);

return d;

}


/* =========================================================
   Escape
========================================================= */

function esc(s){

return String(s??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================================
   Songs
========================================================= */

async function loadSongs(){

busy(true,"در حال بارگذاری آهنگ‌ها...");

try{

const d=
await json("/gists/"+C.gist);

const f=d.files?.[C.file];

songs=f
?JSON.parse(
f.content||'{"songs":[]}'
).songs||[]
:[];

render();

}finally{

busy(false);

}

}


function render(){

const box=
document.getElementById("songs");

if(!songs.length){

box.innerHTML=`
<p>
<i class="bi bi-music-note"></i>
هنوز آهنگی نیست.
</p>
`;

return;

}

box.innerHTML=
songs.map((s,i)=>`

<div class="song">

<div class="song-title">
<b>
<i class="bi bi-music-note-beamed"></i>
${esc(s.title||"بدون عنوان")}
</b>
</div>

<div class="url">
${esc(s.url)}
</div>

<audio
controls
preload="none"
src="${esc(s.url)}"
></audio>

<div>

<button
class="btn goldbtn"
onclick="copy(${i})"
>
<i class="bi bi-clipboard"></i>
کپی لینک
</button>

<a
class="btn ghost"
href="${esc(s.url)}"
target="_blank"
rel="noopener"
>
<i class="bi bi-box-arrow-up-right"></i>
باز کردن
</a>

<button
class="btn rose"
onclick="del(${i})"
>
<i class="bi bi-trash3"></i>
حذف
</button>

</div>

</div>

`).join("");

}


/* =========================================================
   Modal
========================================================= */

function closeAdd(){

const m=
document.getElementById("modal");

if(m.classList.contains("hidden"))
return;

m.classList.add("closing");

setTimeout(()=>{

m.classList.add("hidden");
m.classList.remove("closing");

/* =========================================================
   Filename
========================================================= */

function safeBaseName(name){

return String(name||"audio")
.replace(/\.[^/.]+$/,"")
.replace(/[\\/:*?"<>|]/g,"_")
.replace(/\s+/g,"_")
.trim()
.slice(0,80)||"audio";

}


function isMP3(file){

return file &&
(
file.type==="audio/mpeg" ||
/\.mp3$/i.test(file.name)
);

}


/* =========================================================
   Upload
========================================================= */

async function uploadFile(file,path){

const buffer=
await file.arrayBuffer();

const bytes=
new Uint8Array(buffer);

let binary="";

const chunk=0x8000;

for(
let i=0;
i<bytes.length;
i+=chunk
){

binary+=String.fromCharCode(
...bytes.subarray(
i,
Math.min(i+chunk,bytes.length)
)
);

}

const content=
btoa(binary);

return json(
"/repos/"+C.owner+"/"+C.repo+
"/contents/"+
encodeURIComponent(path)
.replace(/%2F/g,"/"),
{
method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:
"Upload audio for conversion",

content,

branch:C.branch

})

}
);

}


/* =========================================================
   Trigger GitHub Actions
========================================================= */

async function triggerConversion(source,output){

return json(
"/repos/"+C.owner+"/"+C.repo+
"/actions/workflows/"+
encodeURIComponent(C.workflow)+
"/dispatches",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

ref:C.branch,

inputs:{
source,
output
}

})

}
);

}


/* =========================================================
   Check converted file
========================================================= */

async function convertedFileExists(path){

const r=
await api(
"/repos/"+C.owner+"/"+C.repo+
"/contents/"+
encodeURIComponent(path)
.replace(/%2F/g,"/")+
"?ref="+encodeURIComponent(C.branch)
);

if(r.status===200)
return true;

if(r.status===404)
return false;

const d=
await r.json().catch(()=>null);

throw Error(
d?.message||
"خطا در بررسی فایل خروجی"
);

}


/* =========================================================
   Wait for conversion
========================================================= */

async function waitForConversion(
path,
timeout=8*60*1000
){

const start=Date.now();

while(Date.now()-start<timeout){

if(
await convertedFileExists(path)
){
return true;
}

await new Promise(
resolve=>setTimeout(resolve,5000)
);

}

return false;

}


/* =========================================================
   Save Song
========================================================= */

async function saveSong(){

const title=
document.getElementById("title")
.value
.trim();

let file=
document.getElementById("file")
.files[0];

let url=
document.getElementById("url")
.value
.trim();


if(!title){

toast("عنوان را بنویس","err");
return;

}


if(!file&&!url){

toast(
"فایل یا لینک را وارد کن",
"err"
);

return;

}


const saveBtn=
document.getElementById("saveBtn");

saveBtn.disabled=true;

busy(true,"در حال آماده‌سازی...");

try{

/* =========================================
   Direct MP3 URL
========================================= */

if(!file){

if(!/^https?:\/\//i.test(url))
throw Error("لینک نامعتبر است");

songs.push({
title,
url,
size:0,
added:new Date().toISOString()
});

await updateGist();

render();

closeAdd();

toast(
"آهنگ ذخیره شد",
"ok"
);

return;

}


/* =========================================
   File size
========================================= */

if(file.size>30*1024*1024){

throw Error(
"حجم فایل باید کمتر از ۳۰ مگابایت باشد"
);

}


/* =========================================
   Generate unique names
========================================= */

const id=
Date.now()+"_"+Math.random()
.toString(36)
.slice(2,8);

const base=
safeBaseName(file.name);

const source=
C.folder+
"/.convert_"+
id+
"_"+file.name
.replace(/[\\/:*?"<>|]/g,"_");

const output=
C.folder+
"/"+
base+
"_"+id+
".mp3";


/* =========================================
   MP3 = direct upload
========================================= */

if(isMP3(file)){

document.getElementById("convertStatus")
.textContent=
"فایل MP3 است؛ بدون تبدیل آپلود می‌شود.";

document.getElementById("fill")
.style.width="25%";

await uploadFile(
file,
output
);

url=
`https://${C.owner}.github.io/${C.repo}/${C.folder}/${encodeURIComponent(output.split("/").pop())}`;

document.getElementById("fill")
.style.width="80%";

}


/* =========================================
   Non-MP3 = GitHub Actions
========================================= */

else{

document.getElementById("convertStatus")
.textContent=
"فایل غیر MP3 است؛ در حال ارسال به GitHub برای تبدیل...";

document.getElementById("fill")
.style.width="15%";


await uploadFile(
file,
source
);


document.getElementById("fill")
.style.width="30%";

document.getElementById("convertStatus")
.textContent=
"مبدل GitHub Actions شروع شد؛ لطفاً صبر کنید...";


await triggerConversion(
source,
output
);


document.getElementById("fill")
.style.width="40%";


const success=
await waitForConversion(output);


if(!success){

throw Error(
"زمان تبدیل تمام شد. GitHub Actions هنوز فایل MP3 را آماده نکرده است."
);

}


document.getElementById("fill")
.style.width="85%";


url=
`https://${C.owner}.github.io/${C.repo}/${C.folder}/${encodeURIComponent(output.split("/").pop())}`;

document.getElementById("convertStatus")
.textContent=
"تبدیل با موفقیت انجام شد.";

}


/* =========================================
   Update Gist
========================================= */

songs.push({

title,

url,

size:file.size,

added:new Date().toISOString()

});

await updateGist();

document.getElementById("fill")
.style.width="100%";

render();

closeAdd();

toast(
"آهنگ با موفقیت ذخیره شد",
"ok"
);


}catch(e){

console.error(e);

toast(
e?.message||"خطایی رخ داد",
"err"
);

}finally{

busy(false);

saveBtn.disabled=false;

}

}


/* =========================================================
   Gist
========================================================= */

async function updateGist(){

await json(
"/gists/"+C.gist,
{
method:"PATCH",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

files:{

[C.file]:{

content:
JSON.stringify(
{songs},
null,
2
)

}

}

})

}
);

}


/* =========================================================
   Delete
========================================================= */

async function del(i){

const yes=
await customConfirm(
"این آهنگ حذف شود؟",
"حذف آهنگ"
);

if(!yes)
return;

const oldSongs=[...songs];

songs.splice(i,1);

busy(true,"در حال حذف آهنگ...");

try{

await updateGist();

render();

toast(
"حذف شد",
"ok"
);

}catch(e){

songs=oldSongs;

render();

toast(
e.message,
"err"
);

}finally{

busy(false);

}

}
