<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HPanel Radio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

:root{
  --bg:#090705;
  --bg2:#0e0a07;

  --panel:rgba(18,13,9,.68);
  --panel2:rgba(13,10,8,.78);

  --line:rgba(255,255,255,.10);
  --line2:rgba(255,180,58,.18);

  --text:#f7f2ea;
  --muted:#aaa096;

  --gold:#ffb43a;
  --gold2:#ffd27a;

  --mint:#3ee39a;
  --rose:#ff7180;
  --blue:#7fa8ff;

  --shadow:0 24px 70px rgba(0,0,0,.48);
}

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:var(--bg);
}

body{
  margin:0;
  min-height:100vh;

  color:var(--text);

  font-family:
    Lalezar,
    Tahoma,
    sans-serif;

  background:
    radial-gradient(
      circle at 15% 5%,
      rgba(255,180,58,.075),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(255,180,58,.035),
      transparent 28%
    ),
    linear-gradient(
      145deg,
      #080604,
      #0d0906 50%,
      #080604
    );

  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      transparent 0%,
      rgba(255,255,255,.018) 50%,
      transparent 100%
    );

  opacity:.7;
}

button,
input{
  font-family:inherit;
}

button{
  border:0;
}

.wrap{
  width:min(1160px,calc(100% - 28px));
  margin:auto;
  padding:32px 0 60px;
}

/* =========================================================
   INTRO
========================================================= */

body.intro .wrap{
  opacity:0;
  transform:translateY(15px) scale(.99);
}

body.intro-show .wrap{
  opacity:1;
  transform:none;

  transition:
    opacity .65s ease,
    transform .65s cubic-bezier(.22,1,.36,1);
}

/* =========================================================
   HEADER
========================================================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;

  margin-bottom:15px;
}

.brand{
  direction:ltr;

  font-size:34px;
  line-height:1;

  letter-spacing:.2px;

  text-shadow:
    0 4px 18px rgba(0,0,0,.45);
}

.gold{
  color:var(--gold);
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-top:8px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;

  margin-top:9px;

  padding:5px 10px;

  border-radius:999px;

  color:#f5d99e;

  background:rgba(255,180,58,.07);
  border:1px solid rgba(255,180,58,.16);

  font-size:13px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
  cursor:pointer;

  border-radius:15px;

  padding:9px 13px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  font-size:15px;

  box-shadow:
    0 5px 0 rgba(0,0,0,.3);

  transition:
    transform .35s cubic-bezier(.22,1,.36,1),
    opacity .3s,
    box-shadow .3s,
    background .3s;
}

.btn i{
  font-size:16px;
}

.btn:not(:disabled):hover{
  transform:translateY(-3px);
}

.btn:not(:disabled):active{
  transform:translateY(1px);

  box-shadow:
    0 2px 0 rgba(0,0,0,.3);
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.goldbtn{
  background:
    linear-gradient(
      180deg,
      #ffd27a,
      #ff9d1f
    );

  color:#171008;
}

.mint{
  background:
    linear-gradient(
      180deg,
      #6af3b8,
      #17c77a
    );

  color:#042016;
}

.rose{
  background:
    linear-gradient(
      180deg,
      #ff8a97,
      #e23b4d
    );

  color:#fff;
}

.home{
  background:
    linear-gradient(
      180deg,
      #8ab0ff,
      #4d7dff
    );

  color:#061018;

  text-decoration:none;
}

.ghost{
  background:rgba(255,255,255,.045);

  color:var(--text);

  border:1px solid var(--line);

  box-shadow:none;
}

/* =========================================================
   PANELS
========================================================= */

.panel{
  border:1px solid var(--line);

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,180,58,.018),
      rgba(255,255,255,.012)
    );

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  padding:16px;

  box-shadow:
    0 14px 45px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.035);
}

/*
  SONG LIST
  Intentionally darker than the old version.
*/

#songsPanel{
  background:
    linear-gradient(
      145deg,
      rgba(12,9,7,.72),
      rgba(11,8,6,.58),
      rgba(8,6,5,.72)
    );

  border-color:
    rgba(255,255,255,.075);

  box-shadow:
    0 18px 55px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.025);
}

.sectionTitle{
  display:flex;
  align-items:center;
  gap:8px;

  margin:0 0 13px;

  font-size:22px;
}

.sectionTitle i{
  color:var(--gold);
}

/* =========================================================
   TOP CONTROLS
========================================================= */

.controls{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:180px;

  border:1px solid var(--line);

  border-radius:14px;

  padding:10px 13px;

  color:var(--text);

  background:
    rgba(7,5,4,.68);

  outline:none;

  font-size:15px;

  transition:
    border-color .3s,
    box-shadow .3s;
}

.search:focus{
  border-color:rgba(255,180,58,.42);

  box-shadow:
    0 0 0 3px rgba(255,180,58,.08);
}

.search::placeholder{
  color:#777069;
}

/* =========================================================
   ADD PANEL
========================================================= */

.addPanel{
  margin-top:13px;
}

.field{
  margin-top:11px;
}

.field label{
  display:block;
  color:#d8d0c6;
  font-size:14px;
  margin-bottom:6px;
}

.input{
  width:100%;

  padding:10px 12px;

  border-radius:12px;

  border:1px solid var(--line);

  color:var(--text);

  background:
    rgba(7,5,4,.72);

  outline:none;

  font-size:14px;
}

.input:focus{
  border-color:rgba(255,180,58,.4);

  box-shadow:
    0 0 0 3px rgba(255,180,58,.07);
}

.fileRow{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.fileInput{
  flex:1;
  min-width:200px;
}

/* =========================================================
   SONGS
========================================================= */

.songList{
  display:grid;
  gap:10px;
}

.song{
  padding:13px;

  border-radius:16px;

  border:1px solid rgba(255,255,255,.065);

  /*
    Darkened deliberately.
  */

  background:
    linear-gradient(
      145deg,
      rgba(14,10,8,.78),
      rgba(10,8,6,.68)
    );

  box-shadow:
    0 9px 28px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.018);

  transition:
    transform .3s cubic-bezier(.22,1,.36,1),
    border-color .3s,
    background .3s;
}

.song:hover{
  transform:translateY(-2px);

  border-color:
    rgba(255,180,58,.15);

  background:
    linear-gradient(
      145deg,
      rgba(18,13,9,.82),
      rgba(12,9,7,.74)
    );
}

.songTop{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.songTitle{
  min-width:0;

  font-size:19px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.songMeta{
  color:#817a72;
  font-size:12px;
  margin-top:2px;
}

.songActions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.songActions .btn{
  padding:7px 9px;
  font-size:13px;
}

.player{
  margin-top:11px;

  padding:10px;

  border-radius:13px;

  background:
    rgba(5,4,3,.52);

  border:
    1px solid rgba(255,255,255,.055);
}

.playerMain{
  display:flex;
  align-items:center;
  gap:9px;
}

.playBtn{
  width:40px;
  height:40px;

  flex:none;

  border-radius:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  background:
    linear-gradient(
      180deg,
      #ffd27a,
      #ff9d1f
    );

  color:#171008;

  box-shadow:
    0 4px 0 rgba(0,0,0,.32);

  transition:
    transform .25s,
    box-shadow .25s;
}

.playBtn:hover{
  transform:translateY(-2px);
}

.playBtn:active{
  transform:translateY(1px);
  box-shadow:0 2px 0 rgba(0,0,0,.32);
}

.progress{
  flex:1;

  min-width:80px;

  accent-color:var(--gold);

  cursor:pointer;
}

.volume{
  width:85px;

  accent-color:var(--gold);

  cursor:pointer;
}

.time{
  width:88px;

  direction:ltr;

  text-align:center;

  color:#9b9289;

  font-size:12px;
}

.playerBottom{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:8px;

  margin-top:5px;

  color:#756d65;

  font-size:11px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  padding:35px 15px;

  text-align:center;

  color:#777069;
}

.empty i{
  display:block;

  font-size:38px;

  color:#4e4842;

  margin-bottom:8px;
}

/* =========================================================
   BUSY
========================================================= */

.busy{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.48);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);

  z-index:190;

  opacity:1;

  transition:opacity .3s;
}

.busy.hidden{
  display:none;
}

.busyBox{
  padding:20px 26px;

  border-radius:18px;

  text-align:center;

  border:1px solid var(--line);

  background:
    rgba(15,11,8,.88);

  box-shadow:
    var(--shadow);
}

.spin{
  display:inline-block;

  width:18px;
  height:18px;

  border:2px solid rgba(255,255,255,.18);

  border-top-color:var(--gold);

  border-radius:50%;

  animation:
    spinner .7s linear infinite;

  vertical-align:middle;

  margin-left:7px;
}

@keyframes spinner{
  to{
    transform:rotate(360deg);
  }
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  bottom:20px;
  left:50%;

  transform:
    translate(-50%,22px)
    scale(.96);

  padding:12px 18px;

  border-radius:14px;

  background:
    rgba(23,18,13,.78);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1px solid var(--line);

  box-shadow:
    0 18px 45px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.08);

  z-index:200;

  opacity:0;

  animation:
    toastIn .5s cubic-bezier(.22,1,.36,1)
    forwards;

  display:flex;

  align-items:center;

  gap:7px;

  max-width:min(90vw,520px);

  text-align:center;
}

.toast.hide{
  animation:
    toastOut .45s cubic-bezier(.55,0,.78,.18)
    forwards;
}

.toast.ok{
  color:#9dffc9;
}

.toast.err{
  color:#ffb0b7;
}

.toast.info{
  color:#b9d0ff;
}

@keyframes toastIn{
  to{
    opacity:1;

    transform:
      translate(-50%,0)
      scale(1);
  }
}

@keyframes toastOut{
  to{
    opacity:0;

    transform:
      translate(-50%,18px)
      scale(.94);
  }
}

/* =========================================================
   CUSTOM DIALOG
   Extracted from the supplied Dashboard.
========================================================= */

.modal{
  position:fixed;
  inset:0;

  background:
    rgba(8,6,4,.68);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  display:flex;

  align-items:center;
  justify-content:center;

  z-index:100;

  opacity:1;

  animation:
    modalIn .45s cubic-bezier(.22,1,.36,1);
}

.modal.hidden{
  display:none;
}

.modal.closing{
  animation:
    modalOut .4s cubic-bezier(.55,0,.78,.18)
    forwards;
}

.modalbox{
  width:min(560px,calc(100% - 30px));

  padding:20px;

  border-radius:20px;

  border:1px solid var(--line);

  background:
    rgba(22,17,12,.78);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  box-shadow:
    0 28px 80px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);

  animation:
    boxIn .55s cubic-bezier(.22,1,.36,1);
}

.modal.closing .modalbox{
  animation:
    boxOut .35s cubic-bezier(.55,0,.78,.18)
    forwards;
}

@keyframes modalIn{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

@keyframes modalOut{
  from{
    opacity:1;
  }

  to{
    opacity:0;
  }
}

@keyframes boxIn{
  from{
    opacity:0;

    transform:
      translateY(18px)
      scale(.96);
  }

  to{
    opacity:1;

    transform:none;
  }
}

@keyframes boxOut{
  to{
    opacity:0;

    transform:
      translateY(16px)
      scale(.96);
  }
}

/* =========================================================
   CUSTOM ALERT / CONFIRM
========================================================= */

.dialogIcon{
  width:54px;
  height:54px;

  border-radius:16px;

  display:flex;

  align-items:center;
  justify-content:center;

  margin:0 auto 12px;

  font-size:25px;

  background:
    rgba(255,180,58,.12);

  color:var(--gold);

  border:1px solid
    rgba(255,180,58,.22);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.08);
}

.dialogTitle{
  text-align:center;

  font-size:23px;

  margin:0 0 5px;
}

.dialogText{
  text-align:center;

  color:var(--muted);

  font-size:15px;

  line-height:1.8;

  margin:0 0 18px;

  white-space:pre-line;
}

.dialogButtons{
  display:flex;

  gap:8px;
}

.dialogButtons .btn{
  flex:1;
}

.dialogDanger .dialogIcon{
  color:var(--rose);

  background:
    rgba(255,113,128,.10);

  border-color:
    rgba(255,113,128,.25);
}

.dialogSuccess .dialogIcon{
  color:var(--mint);

  background:
    rgba(62,227,154,.10);

  border-color:
    rgba(62,227,154,.25);
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  margin-top:15px;

  padding:13px;

  text-align:center;

  color:#777069;

  font-size:12px;
}

.footerBrand{
  color:#aaa096;

  font-size:15px;

  margin-bottom:4px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .wrap{
    width:min(
      100% - 20px,
      1160px
    );

    padding-top:23px;
  }

  .brand{
    font-size:28px;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .songTop{
    align-items:flex-start;
  }

  .songActions{
    justify-content:flex-start;
  }

  .playerMain{
    flex-wrap:wrap;
  }

  .progress{
    min-width:calc(100% - 50px);
  }

  .volume{
    width:100px;
  }

  .time{
    width:auto;
  }
}

</style>
</head>

<body class="intro">

<div class="wrap">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <div class="header">

    <div>

      <div class="brand">
        <span class="gold">H</span>Panel
        <span>&nbsp;<span class="gold">R</span>adio</span>
      </div>

      <div class="subtitle">
        پخش و مدیریت آهنگ‌های HPanel
      </div>

      <span id="role" class="badge">
        <i class="bi bi-shield-check"></i>
        در حال بررسی...
      </span>

    </div>


    <div class="actions">

      <button
        class="btn rose"
        onclick="logout()"
      >
        <i class="bi bi-box-arrow-right"></i>
        خروج
      </button>


      <a
        class="btn home"
        href="https://herculepanel.github.io/"
      >
        <i class="bi bi-house-fill"></i>
        منوی اصلی
      </a>


      <button
        class="btn ghost"
        onclick="refreshRadio()"
      >
        <i class="bi bi-arrow-clockwise"></i>
        تازه‌سازی
      </button>

    </div>

  </div>


  <!-- =====================================================
       LOADING
  ====================================================== -->

  <div
    id="loading"
    class="panel"
    style="text-align:center;color:var(--muted)"
  >
    <i class="bi bi-music-note-beamed"></i>
    در حال بارگذاری رادیو...
    <span class="spin"></span>
  </div>


  <!-- =====================================================
       APP
  ====================================================== -->

  <main
    id="app"
    style="display:none"
  >

    <!-- SEARCH -->

    <section class="panel">

      <div class="sectionTitle">
        <i class="bi bi-search"></i>
        جستجوی آهنگ
      </div>

      <div class="controls">

        <input
          id="search"
          class="search"
          placeholder="نام آهنگ را جستجو کن..."
          autocomplete="off"
        >

      </div>

    </section>


    <!-- ADD SONG -->

    <section
      id="addPanel"
      class="panel addPanel"
      style="display:none"
    >

      <div class="sectionTitle">
        <i class="bi bi-cloud-plus"></i>
        افزودن آهنگ
      </div>


      <div class="field">

        <label>
          <i class="bi bi-type"></i>
          عنوان آهنگ
        </label>

        <input
          id="songTitle"
          class="input"
          placeholder="مثلاً آهنگ من"
        >

      </div>


      <div class="field">

        <label>
          <i class="bi bi-file-music"></i>
          فایل صوتی
        </label>

        <div class="fileRow">

          <input
            id="songFile"
            class="input fileInput"
            type="file"
            accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac"
          >

        </div>

      </div>


      <div class="field">

        <label>
          <i class="bi bi-link-45deg"></i>
          یا لینک مستقیم MP3
        </label>

        <input
          id="songUrl"
          class="input"
          type="url"
          placeholder="https://example.com/song.mp3"
        >

      </div>


      <div
        class="actions"
        style="margin-top:13px"
      >

        <button
          class="btn goldbtn"
          onclick="addSong()"
        >
          <i class="bi bi-plus-lg"></i>
          افزودن آهنگ
        </button>

      </div>

    </section>


    <!-- SONG LIST -->

    <section
      id="songsPanel"
      class="panel"
      style="margin-top:13px"
    >

      <div class="sectionTitle">
        <i class="bi bi-music-note-list"></i>
        آهنگ‌ها
        <span
          id="songCount"
          class="gold"
        >
          ۰
        </span>
      </div>


      <div
        id="songs"
        class="songList"
      ></div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="footer">

    <div class="footerBrand">
      <span class="gold">H</span>Panel Radio
    </div>

    <div>
      ساخته شده برای اکوسیستم HPanel
    </div>

  </footer>

</div>


<!-- =========================================================
     BUSY
========================================================= -->

<div
  id="busy"
  class="busy hidden"
>

  <div class="busyBox">

    <span class="spin"></span>

    <div id="busyText">
      در حال انجام...
    </div>

  </div>

</div>


<!-- =========================================================
     CUSTOM DIALOG
========================================================= -->

<div
  id="dialogModal"
  class="modal hidden"
>

  <div
    id="dialogBox"
    class="modalbox"
  >

    <div
      id="dialogIcon"
      class="dialogIcon"
    >
      <i class="bi bi-question-lg"></i>
    </div>


    <h2
      id="dialogTitle"
      class="dialogTitle"
    >
      تأیید
    </h2>


    <p
      id="dialogText"
      class="dialogText"
    ></p>

function recoverRadioToken(){

  let t=

  try{

    const items=
      JSON.parse(
        localStorage.getItem(

/* =========================================================
   GITHUB API
========================================================= */

function api(
  path,
  opt={}
){

  return fetch(
    "https://api.github.com"+path,
    {
      ...opt,

      headers:{

        "Accept":
          "application/vnd.github+json",

        "X-GitHub-Api-Version":
          "2022-11-28",

        "Authorization":
          "Bearer "+token,

        ...(opt.headers||{})

      }

    }
  );

}


async function json(
  path,
  opt={}
){

  const r=
    await api(
      path,
      opt
    );


  const d=
    await r
      .json()
      .catch(
        ()=>null
      );


  if(!r.ok){

    throw Error(
      d?.message||
      "GitHub API "+r.status
    );

  }


  return d;

}

/* =========================================================
   URL HELPERS
========================================================= */

function isMp3File(file){

  if(!file)
    return false;


  const name=
    String(
      file.name||""
    )
    .trim()
    .toLowerCase();


  /*
    Filename extension is authoritative.

    This avoids Android/browser MIME bugs where
    a real MP3 can report an incorrect MIME type.
  */

  return /\.mp3$/i.test(name);

}


function isMp3Url(url){

  try{

    return /\.mp3$/i.test(
      new URL(
        url,
        location.href
      ).pathname
    );

  }catch{

    return /\.mp3(?:[?#]|$)/i.test(
      String(url||"").trim()
    );

  }

}


/* =========================================================
   BASE64
========================================================= */

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();


      reader.onload=()=>{

        const result=
          String(
            reader.result||""
          );


        const comma=
          result.indexOf(",");


        resolve(
          comma>=0
            ?result.slice(comma+1)
            :result
        );

      };


      reader.onerror=
        ()=>reject(
          new Error(
            "خواندن فایل ناموفق بود."
          )
        );


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   SAFE FILE NAME
========================================================= */

function safeFileName(name){

  let base=
    String(
      name||"audio"
    )
    .trim()
    .replace(
      /\.[^.]+$/,
      ""
    )
    .replace(
      /[\\/:*?"<>|]+/g,
      "_"
    )
    .replace(
      /\s+/g,
      "-"
    );


  if(!base)
    base="audio";


  return base.slice(0,80);

}


/* =========================================================
   UNIQUE PATH
========================================================= */

function createSongPath(file){

  const base=
    safeFileName(
      file.name
    );


  const stamp=
    Date.now();


  const random=
    Math.random()
      .toString(36)
      .slice(2,7);


  return `${C.folder}/${base}-${stamp}-${random}${isMp3File(file)?".mp3":file.name.slice(file.name.lastIndexOf("."))}`;

}


/* =========================================================
   GITHUB CONTENTS UPLOAD
========================================================= */

async function uploadFileToRepo(
  path,
  file
){

  const content=
    await fileToBase64(file);


  /*
    If a collision occurs, this function is normally
    protected by createSongPath().
  */

  return await json(
    `/repos/${C.owner}/${C.repo}/contents/${encodeURIComponent(path).replace(/%2F/g,"/")}`,
    {

      method:"PUT",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({

          message:
            "Add radio audio",

          content,

          branch:C.branch

        })

    }
  );

}


/* =========================================================
   DELETE FILE FROM REPO
========================================================= */

async function deleteRepoFile(
  path
){

  if(!path)
    return;


  const encoded=
    encodeURIComponent(
      path
    ).replace(
      /%2F/g,
      "/"
    );


  let info;


  try{

    info=
      await json(
        `/repos/${C.owner}/${C.repo}/contents/${encoded}?ref=${encodeURIComponent(C.branch)}`
      );

  }catch{

    return;

  }


  if(!info?.sha)
    return;


  await json(
    `/repos/${C.owner}/${C.repo}/contents/${encoded}`,
    {

      method:"DELETE",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({

          message:
            "Delete radio audio",

          sha:info.sha,

          branch:C.branch

        })

    }
  );

}


/* =========================================================
   DISPATCH CONVERSION
========================================================= */

async function dispatchConversion(
  source,
  output
){

  await json(
    `/repos/${C.owner}/${C.repo}/actions/workflows/${encodeURIComponent(C.workflow)}/dispatches`,
    {

      method:"POST",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({

          ref:C.branch,

          inputs:{
            source,
            output
          }

        })

    }
  );

}


/* =========================================================
   WAIT FOR MP3
========================================================= */

function waitForConvertedFile(
  output
){

  return new Promise(
    (resolve,reject)=>{

      const started=
        Date.now();


      const timeout=
        12*60*1000;


      if(conversionTimer)
        clearInterval(
          conversionTimer
        );


      conversionTimer=
        setInterval(
          async()=>{

            try{

              if(
                Date.now()-started>
                timeout
              ){

                clearInterval(
                  conversionTimer
                );

                conversionTimer=null;

                reject(
                  new Error(
                    "تبدیل MP3 بیش از حد طول کشید."
                  )
                );

                return;

              }


              const encoded=
                encodeURIComponent(
                  output
                ).replace(
                  /%2F/g,
                  "/"
                );


              const r=
                await api(
                  `/repos/${C.owner}/${C.repo}/contents/${encoded}?ref=${encodeURIComponent(C.branch)}`
                );


              if(
                r.ok
              ){

                clearInterval(
                  conversionTimer
                );

                conversionTimer=null;

                resolve(true);

              }

            }catch{}

          },

          5000
        );

    }
  );

}


/* =========================================================
   ADD SONG
========================================================= */

async function addSong(){

  if(!admin){

    await customAlert(
      "فقط مدیر می‌تواند آهنگ اضافه کند.",
      "دسترسی محدود"
    );

    return;

  }


  const title=
    document
      .getElementById(
        "songTitle"
      )
      .value
      .trim();


  const file=
    document
      .getElementById(
        "songFile"
      )
      .files[0];


  const url=
    document
      .getElementById(
        "songUrl"
      )
      .value
      .trim();


  if(!title){

    await customAlert(
      "عنوان آهنگ را وارد کن.",
      "عنوان ناقص"
    );

    return;

  }


  if(!file && !url){

    await customAlert(
      "یک فایل صوتی یا یک لینک MP3 وارد کن.",
      "آهنگ مشخص نشده"
    );

    return;

  }


  if(file && url){

    await customAlert(
      "فقط یکی از فایل یا لینک را وارد کن.",
      "ورودی اضافی"
    );

    return;

  }


  /* -------------------------------------------------------
     DIRECT URL
  ------------------------------------------------------- */

  if(url){

    if(!/^https?:\/\//i.test(url)){

      await customAlert(
        "لینک باید با http:// یا https:// شروع شود.",
        "لینک نامعتبر"
      );

      return;

    }


    if(!isMp3Url(url)){

      const confirmed=
        await customConfirm(

          "این لینک MP3 نیست یا پسوند MP3 آن مشخص نیست.\n\nتبدیل لینک مستقیم به MP3 از طریق این وب‌سایت انجام نمی‌شود.\n\nآیا می‌خواهید همین لینک را به عنوان منبع ذخیره کنید؟",

          "لینک غیر MP3"

        );


      if(!confirmed)
        return;

    }


    busy(
      true,
      "در حال ذخیره آهنگ..."
    );


    try{

      songs.unshift({

        title,

        url,

        size:0,

        added:
          new Date()
            .toISOString(),

        source:
          "url"

      });


      await saveSongs();


      clearAddForm();

      renderSongs();


      toast(
        "آهنگ اضافه شد",
        "ok"
      );

    }catch(e){

      await customAlert(
        e.message,
        "خطا در ذخیره"
      );

    }finally{

      busy(false);

    }


    return;

  }


  /* -------------------------------------------------------
     FILE
  ------------------------------------------------------- */

  if(!isMp3File(file)){

    const confirmed=
      await customConfirm(

        "این فایل MP3 نیست.\n\nاین فایل نمی‌تواند در بازی نوشته شود.\n\nتبدیل به MP3 در همین وب‌سایت در دسترس است.\n\nآیا می‌خواهید ادامه دهید؟",

        "تبدیل فایل به MP3"

      );


    if(!confirmed)
      return;

  }


  busy(
    true,
    isMp3File(file)
      ?"در حال آپلود MP3..."
      :"در حال آپلود فایل برای تبدیل..."
  );


  try{

    const sourcePath=
      createSongPath(file);


    await uploadFileToRepo(
      sourcePath,
      file
    );


    /*
      Direct MP3 upload.
    */

    if(isMp3File(file)){

      const publicUrl=
        `https://${C.owner}.github.io/${C.repo}/${sourcePath}`;


      songs.unshift({

        title,

        url:publicUrl,

        path:sourcePath,

        size:file.size,

        added:
          new Date()
            .toISOString(),

        source:
          "github"

      });


      await saveSongs();


      clearAddForm();

      renderSongs();


      toast(
        "MP3 با موفقیت اضافه شد",
        "ok"
      );


      return;

    }


    /*
      Non-MP3 conversion.
    */

    const outputPath=
      sourcePath.replace(
        /\.[^.]+$/i,
        ".mp3"
      );


    busy(
      true,
      "در حال شروع تبدیل به MP3..."
    );


    await dispatchConversion(
      sourcePath,
      outputPath
    );


    busy(
      true,
      "در حال تبدیل فایل به MP3..."
    );


    await waitForConvertedFile(
      outputPath
    );


    const publicUrl=
      `https://${C.owner}.github.io/${C.repo}/${outputPath}`;


    songs.unshift({

      title,

      url:publicUrl,

      path:outputPath,

      sourcePath,

      size:file.size,

      added:
        new Date()
          .toISOString(),

      source:
        "converted"

    });


    await saveSongs();


    /*
      Remove original non-MP3 source after
      successful conversion.
    */

    try{

      await deleteRepoFile(
        sourcePath
      );

    }catch{}


    clearAddForm();

    renderSongs();


    toast(
      "فایل با موفقیت به MP3 تبدیل شد",
      "ok"
    );

  }catch(e){

    await customAlert(
      e.message,
      "خطا در آپلود یا تبدیل"
    );

  }finally{

    busy(false);

  }

}

    await customAlert(

    );

  const song=

  const confirmed=

    toast(
      "آهنگ حذف شد",

  }catch(e){

    await customAlert(

  }

   COPY LINK
========================================================= */

async function copyLink(
  url
){

  try{

    await navigator.clipboard.writeText(
      url
    );


    toast(
      "لینک کپی شد",
      "ok"
    );

  }catch{

    await customAlert(
      url,
      "لینک آهنگ"
    );

  }

}


/* =========================================================
   OPEN LINK
========================================================= */

function openSong(
  url
){

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(
  seconds
){

  if(!Number.isFinite(seconds))
    return "00:00";


  seconds=
    Math.max(
      0,
      Math.floor(seconds)
    );


  const m=
    Math.floor(
      seconds/60
    );


  const s=
    seconds%60;


  return (
    String(m).padStart(2,"0")+
    ":"+
    String(s).padStart(2,"0")
  );

}


/* =========================================================
   PLAYER
========================================================= */

function setupPlayer(
  index,
  audio,
  playButton,
  progress,
  time,
  volume
){

  audio.preload="metadata";


  volume.value=
    audio.volume;


  audio.addEventListener(
    "loadedmetadata",
    ()=>{

      progress.max=
        audio.duration||0;

      time.textContent=
        "00:00 / "+
        formatTime(
          audio.duration
        );

    }
  );


  audio.addEventListener(
    "timeupdate",
    ()=>{

      progress.max=
        audio.duration||0;

      progress.value=
        audio.currentTime||0;


      time.textContent=
        formatTime(
          audio.currentTime
        )+
        " / "+
        formatTime(
          audio.duration
        );

    }
  );


  audio.addEventListener(
    "ended",
    ()=>{

      playButton.innerHTML=
        '<i class="bi bi-play-fill"></i>';


      if(activeAudio===audio)
        activeAudio=null;

    }
  );


  playButton.onclick=()=>{

    if(
      activeAudio &&
      activeAudio!==audio
    ){

      activeAudio.pause();

      document
        .querySelectorAll(
          ".playBtn"
        )
        .forEach(
          b=>{
            b.innerHTML=
              '<i class="bi bi-play-fill"></i>';
          }
        );

    }


    if(audio.paused){

      audio.play()
        .then(()=>{

          activeAudio=
            audio;

          playButton.innerHTML=
            '<i class="bi bi-pause-fill"></i>';

        })
        .catch(async()=>{

          await customAlert(
            "پخش این آهنگ توسط مرورگر امکان‌پذیر نیست.",
            "خطا در پخش"
          );

        });

    }else{

      audio.pause();

      playButton.innerHTML=
        '<i class="bi bi-play-fill"></i>';

    }

  };


  progress.oninput=()=>{

    if(
      Number.isFinite(
        audio.duration
      )
    ){

      audio.currentTime=
        Number(
          progress.value
        );

    }

  };


  volume.oninput=()=>{

    audio.volume=
      Number(
        volume.value
      );

  };

}


/* =========================================================
   RENDER SONGS
========================================================= */

function renderSongs(){

  const root=
    document.getElementById(
      "songs"
    );


  const query=
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const filtered=
    songs.filter(
      s=>
        String(
          s.title||""
        )
        .toLowerCase()
        .includes(query)
    );


  document.getElementById(
    "songCount"
  ).textContent=
    String(
      filtered.length
    );


  root.innerHTML="";


  if(!filtered.length){

    root.innerHTML=`

      <div class="empty">

        <i class="bi bi-music-note-list"></i>

        ${
          query
            ?"آهنگی با این نام پیدا نشد."
            :"هنوز آهنگی اضافه نشده است."
        }

      </div>

    `;

    return;

  }


  filtered.forEach(
    song=>{

      const realIndex=
        songs.indexOf(
          song
        );


      const card=
        document.createElement(
          "article"
        );


      card.className=
        "song";


      const audio=
        document.createElement(
          "audio"
        );


      audio.src=
        song.url;


      audio.preload=
        "metadata";


      const size=
        song.size
          ?formatBytes(song.size)
          :"لینک خارجی";


      card.innerHTML=`

        <div class="songTop">

          <div style="min-width:0">

            <div class="songTitle">
              <i class="bi bi-music-note-beamed gold"></i>
              ${esc(song.title||"بدون عنوان")}
            </div>

            <div class="songMeta">
              ${esc(size)}
            </div>

          </div>


          <div class="songActions">

            <button
              class="btn ghost"
              data-action="copy"
            >
              <i class="bi bi-copy"></i>
              کپی لینک
            </button>


            <button
              class="btn home"
              data-action="open"
            >
              <i class="bi bi-box-arrow-up-right"></i>
              باز کردن
            </button>

            ${
              admin
              ?`

                <button
                  class="btn goldbtn"
                  data-action="edit"
                >
                  <i class="bi bi-pencil-square"></i>
                  ویرایش
                </button>


                <button
                  class="btn rose"
                  data-action="delete"
                >
                  <i class="bi bi-trash3"></i>
                  حذف
                </button>

              `
              :""
            }

          </div>

        </div>


        <div class="player">

          <div class="playerMain">

            <button
              class="playBtn"
              type="button"
            >
              <i class="bi bi-play-fill"></i>
            </button>


            <input
              class="progress"
              type="range"
              min="0"
              max="0"
              step="0.1"
              value="0"
            >


            <div class="time">
              00:00 / 00:00
            </div>


            <input
              class="volume"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="1"
            >

          </div>


          <div class="playerBottom">

            <span>
              <i class="bi bi-headphones"></i>
              پخش سفارشی HPanel
            </span>

            <span>
              MP3
            </span>

          </div>

        </div>

      `;


      card
        .querySelector(
          ".player"
        )
        .prepend(
          audio
        );


      root.appendChild(
        card
      );


      const playButton=
        card.querySelector(
          ".playBtn"
        );


      const progress=
        card.querySelector(
          ".progress"
        );


      const volume=
        card.querySelector(
          ".volume"
        );


      const time=
        card.querySelector(
          ".time"
        );


      setupPlayer(
        realIndex,
        audio,
        playButton,
        progress,
        time,
        volume
      );


      card
        .querySelector(
          '[data-action="copy"]'
        )
        .onclick=
          ()=>copyLink(
            song.url
          );


      card
        .querySelector(
          '[data-action="open"]'
        )
        .onclick=
          ()=>openSong(
            song.url
          );


      const edit=
        card.querySelector(
          '[data-action="edit"]'
        );


      if(edit){

        edit.onclick=
          ()=>editSong(
            realIndex
          );

      }


      const del=
        card.querySelector(
          '[data-action="delete"]'
        );


      if(del){

        del.onclick=
          ()=>deleteSong(
            realIndex
          );

      }

    }
  );

}


/* =========================================================
   FILE SIZE
========================================================= */

function formatBytes(
  bytes
){

  if(!Number.isFinite(bytes)||bytes<=0)
    return "فایل";


  const units=[
    "B",
    "KB",
    "MB",
    "GB"
  ];


  let i=0;
  let n=bytes;


  while(
    n>=1024 &&
    i<units.length-1
  ){

    n/=1024;
    i++;

  }


  return (
    n.toFixed(
      i===0?0:1
    )+
    " "+
    units[i]
  );

}


/* =========================================================
   SEARCH
========================================================= */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    renderSongs
  );


/* =========================================================
   LOGOUT
   Same behavior/message as supplied Dashboard.
========================================================= */

async function logout(){

  const confirmed=
    await customConfirm(
      "آیا می‌خواهی از HPanel خارج شوی؟",
      "خروج از حساب"
    );


  if(!confirmed)
    return;


  localStorage.removeItem(
    AUTH
  );


  localStorage.removeItem(
    RADIO_TOKEN
  );


  location.href=
    "https://herculepanel.github.io/";

}


/* =========================================================
   INITIALIZATION
========================================================= */

(async()=>{

  const a=
    getAuth();


  document.getElementById(
    "loading"
  ).style.display=
    "block";


  /*
    IMPORTANT:
    hpanel_auth is the JSON object used by
    the actual HPanel Vault/Dashboard system.
  */

  if(!a?.loggedIn){

    location.href=
      "https://herculepanel.github.io/vault/";

    return;

  }


  admin=
    !!a.admin;


  token=
    recoverRadioToken();


  /*
    Do NOT redirect endlessly if the shared auth exists
    but the Radio token is missing.
  */

  if(!token){

    document.getElementById(
      "loading"
    ).style.display=
      "none";


    await customAlert(
      "توکن رادیو پیدا نشد. دوباره از Vault وارد شوید.",
      "توکن پیدا نشد"
    );


    return;

  }


  document.getElementById(
    "role"
  ).innerHTML=
    admin
      ?`
        <i class="bi bi-shield-fill-check"></i>
        مدیر
      `
      :`
        <i class="bi bi-person-check"></i>
        کاربر
      `;


  /*
    Only admins get the Add Song panel.
  */

  if(admin){

    document.getElementById(
      "addPanel"
    ).style.display=
      "block";

  }


  try{

    await json(
      `/repos/${C.owner}/${C.repo}`
    );


    await loadSongs();


    document.getElementById(
      "loading"
    ).style.display=
      "none";


    document.getElementById(
      "app"
    ).style.display=
      "block";


    renderSongs();


  }catch(e){

    document.getElementById(
      "loading"
    ).style.display=
      "none";


    await customAlert(
      "بررسی ورود یا بارگذاری رادیو ناموفق بود:\n"+
      e.message,
      "خطای ورود"
    );

  }

})();

</script>
