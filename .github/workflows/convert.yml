name: Convert Audio To MP3

on:
  workflow_dispatch:

    inputs:

      source:
        description: "Path of the uploaded source audio file"
        required: true
        type: string

      output:
        description: "Path of the converted MP3 file"
        required: true
        type: string


permissions:
  contents: write


jobs:

  convert:

    name: Convert audio to MP3

    runs-on: ubuntu-latest


    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # Install FFmpeg
      # --------------------------------------------------

      - name: Install FFmpeg
        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg


      # --------------------------------------------------
      # Show requested paths
      # --------------------------------------------------

      - name: Check conversion paths
        shell: bash
        run: |

          echo "Source:"
          echo "${{ inputs.source }}"

          echo ""

          echo "Output:"
          echo "${{ inputs.output }}"

          echo ""

          if [ -z "${{ inputs.source }}" ]; then
            echo "Source path is empty."
            exit 1
          fi

          if [ -z "${{ inputs.output }}" ]; then
            echo "Output path is empty."
            exit 1
          fi


      # --------------------------------------------------
      # Verify source exists
      # --------------------------------------------------

      - name: Verify source file
        shell: bash
        run: |

          if [ ! -f "${{ inputs.source }}" ]; then

            echo "ERROR:"
            echo "The source file does not exist."

            echo ""
            echo "Current repository files:"

            find . -maxdepth 3 -type f | sort | head -200

            exit 1

          fi


          echo "Source file found."

          echo ""
          echo "File information:"

          file "${{ inputs.source }}"

          echo ""
          echo "File size:"

          du -h "${{ inputs.source }}"


      # --------------------------------------------------
      # Prepare output folder
      # --------------------------------------------------

      - name: Prepare output folder
        shell: bash
        run: |

          mkdir -p "$(dirname "${{ inputs.output }}")"


      # --------------------------------------------------
      # Convert to MP3
      # --------------------------------------------------

      - name: Convert to MP3
        shell: bash
        run: |

          echo "Starting FFmpeg conversion..."

          ffmpeg \
            -hide_banner \
            -loglevel warning \
            -y \
            -i "${{ inputs.source }}" \
            -vn \
            -map_metadata 0 \
            -codec:a libmp3lame \
            -b:a 192k \
            -ar 44100 \
            -ac 2 \
            "${{ inputs.output }}"


      # --------------------------------------------------
      # Verify generated MP3
      # --------------------------------------------------

      - name: Verify MP3
        shell: bash
        run: |

          if [ ! -f "${{ inputs.output }}" ]; then

            echo "ERROR:"
            echo "FFmpeg did not create the output file."

            exit 1

          fi


          if [ ! -s "${{ inputs.output }}" ]; then

            echo "ERROR:"
            echo "The generated MP3 is empty."

            exit 1

          fi


          echo "MP3 successfully created."

          echo ""
          echo "Output information:"

          file "${{ inputs.output }}"

          echo ""
          echo "Output size:"

          du -h "${{ inputs.output }}"


      # --------------------------------------------------
      # Remove source?
      #
      # We intentionally KEEP the original file.
      # The user requested that the original non-MP3 file
      # be uploaded to the repo first and then converted.
      # --------------------------------------------------

      - name: Keep original source file
        shell: bash
        run: |

          echo "Original source file will be kept."

          echo "Converted MP3:"
          echo "${{ inputs.output }}"


      # --------------------------------------------------
      # Commit MP3
      # --------------------------------------------------

      - name: Commit converted MP3
        shell: bash
        run: |

          git config user.name "HPanel Radio"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add "${{ inputs.output }}"


          if git diff --cached --quiet; then

            echo "No new MP3 changes to commit."

          else

            git commit \
              -m "Convert audio to MP3"

            git push origin "${GITHUB_REF_NAME}"

          fi


      # --------------------------------------------------
      # Finished
      # --------------------------------------------------

      - name: Conversion complete
        shell: bash
        run: |

          echo "========================================"

          echo "HPanel Radio conversion complete."

          echo "Source:"
          echo "${{ inputs.source }}"

          echo ""

          echo "MP3:"
          echo "${{ inputs.output }}"

          echo "========================================"
