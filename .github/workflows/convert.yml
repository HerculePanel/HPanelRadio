name: Convert Audio To MP3

on:
  workflow_dispatch:

    inputs:

      source:
        description: "Source audio file inside the repository"
        required: true
        type: string

      output:
        description: "Output MP3 file inside the repository"
        required: true
        type: string


permissions:
  contents: write


jobs:

  convert:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      - name: Check source file
        shell: bash
        run: |

          echo "Source:"
          echo "${{ inputs.source }}"

          echo "Output:"
          echo "${{ inputs.output }}"

          if [ ! -f "${{ inputs.source }}" ]; then
            echo "ERROR: Source file does not exist."
            exit 1
          fi

          echo "Source file found."

          ls -lh "${{ inputs.source }}"


      - name: Convert audio to MP3
        shell: bash
        run: |

          mkdir -p "$(dirname "${{ inputs.output }}")"

          ffmpeg \
            -y \
            -i "${{ inputs.source }}" \
            -vn \
            -codec:a libmp3lame \
            -b:a 192k \
            -ar 44100 \
            -ac 2 \
            "${{ inputs.output }}"


      - name: Verify MP3
        shell: bash
        run: |

          if [ ! -f "${{ inputs.output }}" ]; then
            echo "ERROR: MP3 output was not created."
            exit 1
          fi

          if [ ! -s "${{ inputs.output }}" ]; then
            echo "ERROR: MP3 output is empty."
            exit 1
          fi

          echo "MP3 successfully created."

          ls -lh "${{ inputs.output }}"

          ffprobe \
            -v error \
            -show_entries format=format_name \
            -of default=noprint_wrappers=1 \
            "${{ inputs.output }}"


      - name: Commit MP3
        shell: bash
        run: |

          git config user.name "HPanel Radio"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ inputs.output }}"

          git commit \
            -m "Convert audio to MP3" \
            || echo "Nothing new to commit."

          git push
